<script>
(function(){

var MARK='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJQZXN0SHViIj48ZyBzdHJva2U9IiMwNDY3MjUiIHN0cm9rZS13aWR0aD0iMy42IiBzdHJva2UtbGluZWNhcD0icm91bmQiIGZpbGw9Im5vbmUiPjxwYXRoIGQ9Ik0yNiAyNyAxMSAxNk0yNCAzNkg2TTI2IDQ1IDExIDU2TTM4IDI3IDUzIDE2TTQwIDM2SDU4TTM4IDQ1IDUzIDU2Ii8+PC9nPjxnIGZpbGw9IiMwNDY3MjUiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTYiIHI9IjUiLz48Y2lyY2xlIGN4PSI2IiBjeT0iMzYiIHI9IjUiLz48Y2lyY2xlIGN4PSIxMSIgY3k9IjU2IiByPSI1Ii8+PGNpcmNsZSBjeD0iNTMiIGN5PSIxNiIgcj0iNSIvPjxjaXJjbGUgY3g9IjU4IiBjeT0iMzYiIHI9IjUiLz48Y2lyY2xlIGN4PSI1MyIgY3k9IjU2IiByPSI1Ii8+PC9nPjxjaXJjbGUgY3g9IjMyIiBjeT0iMTQiIHI9IjciIGZpbGw9IiMxZjIzMjQiLz48ZWxsaXBzZSBjeD0iMzIiIGN5PSIzNiIgcng9IjExIiByeT0iMTUiIGZpbGw9IiMxZjIzMjQiLz48cGF0aCBkPSJNMzIgMjJWNTEiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyLjQiLz48L3N2Zz4=';

var app=document.getElementById('app');
function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
var S={view:'home',active:[],items:[],techs:[],log:[],loaded:false,err:'',filter:'all',br:'all',me:store('trapMe')||'',f:{},sel:null,c:{}};
function api(fn){ var args=[].slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){ if(!r.ok) throw new Error('Server error '+r.status); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Something went wrong.'); return j.data; })
    .catch(function(e){ throw (e instanceof TypeError ? new Error('No connection. Check Wi-Fi or data.') : e); }); }

function msg(e){ return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,''); }
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(function(){el.hidden=true;},2800); }
function dur(ms){ var m=Math.round(Math.abs(ms)/60000); if(m<60) return m+' min'; var h=Math.floor(m/60); if(h<24) return h+' hr'+(m%60&&h<6?' '+(m%60)+' min':''); return Math.floor(h/24)+'d '+(h%24)+'h'; }

function pill(t){ var left=t.nextDue-Date.now(), s=state(t); return '<span class="pill '+s+'">'+(left<0?'Overdue '+dur(left):'Check in '+dur(left))+'</span>'; }

function spare(itemId,tech){ var who=String(tech||'').toLowerCase(), it=S.items.filter(function(i){return i.id===itemId;})[0]; if(!it||!who) return 0;
  var have=it.out.filter(function(o){return o.tech.toLowerCase()===who;}).reduce(function(a,o){return a+o.qty;},0);
  var set=S.active.filter(function(t){return t.itemId===itemId&&t.tech.toLowerCase()===who;}).reduce(function(a,t){return a+t.qty;},0);
  return Math.max(0,have-set); }
function trapItems(){ var t=S.items.filter(function(i){ return /trap/i.test(i.name); }); return t.length?t:S.items; }
function byId(id){ return S.active.filter(function(t){return t.id===id;})[0]; }
function maps(t){ return t.lat!=null&&t.lat!==''?'https://maps.apple.com/?daddr='+t.lat+','+t.lng+'&q='+encodeURIComponent(t.address):'https://maps.apple.com/?daddr='+encodeURIComponent(t.address); }
function header(right){ return '<a class="back" href="../index.html">← All tools</a><div class="top"><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Trap Checks</b><span class="eyebrow">Every trap, checked on time</span></div></div>'+(right||'')+'</div>'; }

/* ---------- offline-safe queue ---------- */
function getQ(){ try{ return JSON.parse(store('trapQueue')||'[]'); }catch(_){ return []; } }
function setQ(q){ store('trapQueue',JSON.stringify(q)); }
function overlay(list){ list=list.map(function(t){ return Object.assign({},t); });
  getQ().forEach(function(op){
    if(op.fn==='trapSet'){ if(!list.some(function(t){return t.id==='T'+op.key.slice(-10);})) list.push({id:'T'+op.key.slice(-10),branch:op.branch,tech:op.tech,itemId:op.itemId,item:op.item,qty:op.qty,address:op.address,lat:op.lat,lng:op.lng,target:op.target,job:op.job,notes:op.notes,setAt:op.when,every:op.every,lastCheck:null,nextDue:op.when+op.every*3600000,status:'Active',catches:0,pending:true}); }
    else { var t=list.filter(function(x){return x.id===op.trapId;})[0]; if(!t) return;
      if(op.result==='Pulled'||(op.result==='Caught'&&!op.keep)) list=list.filter(function(x){return x!==t;});
      else { t.lastCheck=op.when; t.nextDue=op.when+t.every*3600000; if(op.result==='Caught') t.catches+=op.count||1; } }

    :api('trapCheck',op.trapId,op.tech,op.result,op.animal,op.count,op.keep,op.notes,op.when,op.key);
  call.then(function(){ setQ(getQ().filter(function(x){return x.key!==op.key;})); flushing=false; if(!getQ().length) load(); else if(S.view==='home') render(); flush(); })
    .catch(function(e){ flushing=false; var m=msg(e); if(!retryable(m)){ setQ(getQ().filter(function(x){return x.key!==op.key;})); toast('Not saved: '+m); load(); flush(); } }); }
setInterval(flush,20000); window.addEventListener('online',flush);
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ flush(); if(S.view==='home') load(); } });
function queue(op){ op.key=Date.now().toString(36)+Math.random().toString(36).slice(2,8); op.when=Date.now(); var q=getQ(); q.push(op); setQ(q); S.active=overlay(S.active); flush(); }

/* ---------- data ---------- */
function apply(d){ S.active=overlay(d.active||[]); S.items=d.items||[]; S.techs=d.techs||[]; S.log=d.log||[]; S.loaded=true; S.err=''; }
function fromCache(){ try{ var c=JSON.parse(store('trapCache')||'null'); if(c&&c.active) apply(c); }catch(_){} }
function load(){ var was=S.loaded; return api('trapList').then(function(d){ store('trapCache',JSON.stringify(d)); apply(d); if(S.view==='home') render(); else if(!was&&S.view!=='home'){ keepF(); render(); } })
  .catch(function(e){ if(!S.loaded){ S.err='Can’t reach Trap Checks: '+msg(e); } if(S.view==='home') render(); }); }

/* ---------- views ---------- */
function vHome(){
  var list=S.active.filter(function(t){ return (S.br==='all'||t.branch===BRANCHES[S.br])&&(S.filter==='all'||(S.filter==='mine'?t.tech===S.me:state(t)==='crit')); })
    .sort(function(a,b){ return a.nextDue-b.nextDue; });
  var over=S.active.filter(function(t){return state(t)==='crit';}).length, n=getQ().length;
  var body=!S.loaded?'<div class="empty">'+(S.err?esc(S.err):'Loading traps…')+'</div>':!S.active.length?'<div class="empty"><b>No traps out</b>Tap “Set a trap” when you put one out.</div>':
    !list.length?'<div class="empty">No traps match.</div>':'<div class="list">'+list.map(function(t){ var s=state(t);
      return '<div class="t '+s+'"><div class="row"><a class="addr" href="'+maps(t)+'" target="_blank" rel="noopener">'+esc(t.address)+' ↗</a>'+pill(t)+'</div>'+
        '<div class="meta">'+t.qty+' × '+esc(t.item)+(t.target?' · '+esc(t.target):'')+' · <b>'+esc(t.tech)+'</b>'+(t.branch?' · '+esc(t.branch):'')+'</div>'+
        '<div class="meta">Set '+dur(Date.now()-t.setAt)+' ago · '+(t.lastCheck?'last checked '+dur(Date.now()-t.lastCheck)+' ago':'not checked yet')+(t.catches?' · '+t.catches+' caught':'')+(t.job?' · Job '+esc(t.job):'')+(t.pending?' · syncing…':'')+'</div>'+
        (t.notes?'<div class="meta">“'+esc(t.notes)+'”</div>':'')+
        '<div class="acts"><button class="btn primary" data-a="check" data-id="'+t.id+'">Log a check</button></div></div>'; }).join('')+'</div>';
  return header('')+
    (n?'<div class="note">⟳ '+n+' update'+(n===1?'':'s')+' waiting to sync — it’ll send when you have signal.</div>':'')+
    '<button class="btn primary big" data-a="new">+ Set a trap</button>'+
    (S.loaded&&S.active.length?'<div class="chips">'+[['all','All ('+S.active.length+')'],['mine',S.me?'Mine':'Mine (pick name)'],['over','Overdue ('+over+')']].map(function(f){ return '<button class="chip" data-a="filter" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'; }).join('')+'</div>'+
      '<div class="chips">'+[['all','All branches']].concat(Object.keys(BRANCHES).map(function(k){return [k,BRANCHES[k]];})).map(function(b){ return '<button class="chip" data-a="br" data-b="'+b[0]+'" aria-pressed="'+(S.br===b[0])+'">'+b[1]+'</button>'; }).join('')+'</div>':'')+
    body+
    (S.log.length?'<h3>Recent activity</h3><div>'+S.log.slice(0,15).map(function(l){ return '<div class="log"><span class="w">'+fmt(l.when)+'</span><span><b>'+esc(l.tech)+'</b> · '+esc(l.action)+(l.animal?' '+esc((l.count||'')+' '+l.animal):'')+' · '+esc(l.address)+(l.notes?' <span style="color:var(--muted)">— '+esc(l.notes)+'</span>':'')+'</span></div>'; }).join('')+'</div>':'');
}
function stepper(k,max){ return '<div class="step"><button type="button" data-a="dec" data-k="'+k+'">−</button><output>'+S.f[k]+'</output><button type="button" data-a="inc" data-k="'+k+'" data-max="'+max+'">+</button></div>'; }
function techGrid(cur,act){ if(!S.loaded) return '<div class="note">Loading names\u2026</div>'; return S.techs.length?'<div class="grid">'+S.techs.map(function(t,i){ return '<button type="button" class="tech" data-a="'+act+'" data-i="'+i+'" aria-pressed="'+(cur===t)+'">'+esc(t)+'</button>'; }).join('')+'</div>':'<div class="note">No techs yet. Add them in Inventory → Manager → Techs.</div>'; }
function vNew(){ var f=S.f, items=trapItems(), it=items.filter(function(i){return i.id===f.itemId;})[0], sp=it?spare(it.id,f.tech):0, max=it?Math.max(1,avail(it)+sp):1;
  return header('<button class="btn sm" data-a="home">Cancel</button>')+'<div><span class="eyebrow">New trap</span><h2>Set a trap</h2></div>'+
    '<span class="eyebrow">Who’s setting it?</span>'+techGrid(f.tech,'pickTech')+
    '<label>Branch<select id="fBranch">'+Object.keys(BRANCHES).map(function(k){ return '<option'+(f.branch===BRANCHES[k]?' selected':'')+'>'+BRANCHES[k]+'</option>'; }).join('')+'</select></label>'+
    '<span class="eyebrow">Which trap?</span><div class="res">'+items.map(function(i){ var a=avail(i), m=spare(i.id,f.tech); return '<button type="button" data-a="pickItem" data-id="'+i.id+'" aria-pressed="'+(f.itemId===i.id)+'"'+(a||m?'':' disabled')+'>'+esc(i.name)+'<small>'+(m?'You have '+m+' on hand':a+' in the shop')+'</small></button>'; }).join('')+'</div>'+
    (it?'<span class="eyebrow">How many?</span>'+stepper('qty',max)+'<p class="meta" style="margin:0;color:var(--muted);font-size:.9rem">'+(sp>=f.qty?'Using '+(f.qty===1?'a trap':'traps')+' you already checked out \u2014 Equipment won\u2019t change.':(sp?sp+' from your truck, '+(f.qty-sp)+' will be checked out from the shop.':'You don\u2019t have this checked out, so '+(f.qty===1?'it':'they')+'\u2019ll be checked out to you from the shop.'))+'</p>':'')+
    '<label>Address<input id="fAddr" value="'+esc(f.address||'')+'" placeholder="Street address" autocomplete="street-address"></label>'+
    '<button type="button" class="btn sm" data-a="here" style="justify-self:start">◎ Use my location</button>'+(f.lat?'<span class="eyebrow" style="text-transform:none;letter-spacing:0">📍 Location saved for directions</span>':'')+
    '<span class="eyebrow">Target animal</span><div class="chips">'+ANIMALS.map(function(a){ return '<button type="button" class="chip" data-a="target" data-v="'+a+'" aria-pressed="'+(f.target===a)+'">'+a+'</button>'; }).join('')+'</div>'+
    '<label>Check every<select id="fEvery">'+[[12,'12 hours'],[24,'24 hours'],[48,'48 hours']].map(function(o){ return '<option value="'+o[0]+'"'+(+f.every===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></label>'+
    '<label>Job # (optional)<input id="fJob" value="'+esc(f.job||'')+'" inputmode="numeric"></label>'+
    '<label>Notes (optional)<input id="fNotes" value="'+esc(f.notes||'')+'" placeholder="e.g. under back deck, left side"></label>'+
    '<div class="sticky"><button class="btn primary big" data-a="saveNew"'+(f.tech&&it?'':' disabled')+'>Set trap</button></div>';
}
var RESULTS=[['Empty','Nothing caught','Countdown restarts'],['Caught','Animal caught',''],['Released','Non-target released','Countdown restarts'],['Reset','Tripped / re-baited','Countdown restarts'],['Pulled','Pull the trap','Stays checked out to you']];
function vCheck(){ var t=byId(S.sel); if(!t) return header('')+'<div class="empty">That trap was already pulled.</div><button class="btn" data-a="home">Back</button>';
  var c=S.c;
  return header('<button class="btn sm" data-a="home">Cancel</button>')+'<div><span class="eyebrow">Log a check</span><h2>'+esc(t.address)+'</h2><div class="meta" style="color:var(--muted)">'+t.qty+' × '+esc(t.item)+(t.target?' · '+esc(t.target):'')+' · '+pill(t)+'</div></div>'+
    '<span class="eyebrow">Who’s checking?</span>'+techGrid(c.tech,'pickChecker')+
    '<span class="eyebrow">What did you find?</span><div class="res">'+RESULTS.map(function(r){ return '<button type="button" data-a="result" data-v="'+r[0]+'" aria-pressed="'+(c.result===r[0])+'">'+r[1]+(r[2]?'<small>'+r[2]+'</small>':'')+'</button>'; }).join('')+'</div>'+
    (c.result==='Caught'||c.result==='Released'?'<span class="eyebrow">Animal</span><div class="chips">'+ANIMALS.map(function(a){ return '<button type="button" class="chip" data-a="animal" data-v="'+a+'" aria-pressed="'+(c.animal===a)+'">'+a+'</button>'; }).join('')+'</div>':'')+
    (c.result==='Caught'?'<span class="eyebrow">How many?</span><div class="step"><button type="button" data-a="cdec">−</button><output>'+c.count+'</output><button type="button" data-a="cinc">+</button></div>'+
      '<div class="chips"><button type="button" class="chip" data-a="keep" data-v="1" aria-pressed="'+(!!c.keep)+'">Leave trap set</button><button type="button" class="chip" data-a="keep" data-v="0" aria-pressed="'+(!c.keep)+'">Pull trap</button></div>':'')+
    '<label>Notes (optional)<input id="cNotes" value="'+esc(c.notes||'')+'"></label>'+
    '<div class="sticky"><button class="btn primary big" data-a="saveCheck"'+(c.tech&&c.result?'':' disabled')+'>Save check</button></div>';
}
function render(){ app.innerHTML=({home:vHome,new:vNew,check:vCheck})[S.view](); }
function go(v){ S.view=v; render(); window.scrollTo(0,0); }
function keepF(){ var g=function(id){ var e=document.getElementById(id); return e?e.value:undefined; };
  if(S.view==='new'){ var v; if((v=g('fAddr'))!==undefined) S.f.address=v; if((v=g('fBranch'))!==undefined) S.f.branch=v; if((v=g('fEvery'))!==undefined) S.f.every=+v; if((v=g('fJob'))!==undefined) S.f.job=v; if((v=g('fNotes'))!==undefined) S.f.notes=v; }
  if(S.view==='check'){ var n=g('cNotes'); if(n!==undefined) S.c.notes=n; } }
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b||b.disabled) return; var a=b.getAttribute('data-a'); keepF();
  if(a==='new'){ var br=(store('shopBranch')||'IF').toUpperCase(); S.f={tech:S.me&&S.techs.indexOf(S.me)>=0?S.me:'',branch:BRANCHES[br]||'North Branch',itemId:'',qty:1,address:'',lat:null,lng:null,target:'',every:24,job:'',notes:''}; go('new'); }
  else if(a==='home'){ go('home'); load(); }
  else if(a==='filter'){ S.filter=b.getAttribute('data-f'); render(); }
  else if(a==='br'){ S.br=b.getAttribute('data-b'); render(); }
  else if(a==='pickTech'){ S.f.tech=S.techs[+b.getAttribute('data-i')]; S.f.qty=1; render(); }
  else if(a==='pickChecker'){ S.c.tech=S.techs[+b.getAttribute('data-i')]; render(); }
  else if(a==='pickItem'){ S.f.itemId=b.getAttribute('data-id'); S.f.qty=1; var it=S.items.filter(function(i){return i.id===S.f.itemId;})[0]; if(it&&!S.f.target){ var m=ANIMALS.filter(function(x){ return it.name.toLowerCase().indexOf(x.toLowerCase())>=0; })[0]; if(m) S.f.target=m; } render(); }
  else if(a==='inc'){ S.f.qty=Math.min(+b.getAttribute('data-max'),S.f.qty+1); render(); }
  else if(a==='dec'){ S.f.qty=Math.max(1,S.f.qty-1); render(); }
  else if(a==='target'){ var v=b.getAttribute('data-v'); S.f.target=S.f.target===v?'':v; render(); }
  else if(a==='here'){ if(!navigator.geolocation){ toast('Location not available on this device.'); return; } toast('Finding your location…');
    navigator.geolocation.getCurrentPosition(function(p){ S.f.lat=+p.coords.latitude.toFixed(6); S.f.lng=+p.coords.longitude.toFixed(6);
      fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+S.f.lat+'&lon='+S.f.lng,{headers:{'Accept-Language':'en'}}).then(function(r){return r.json();}).then(function(x){
        var ad=x.address||{}, st=[ad.house_number,ad.road].filter(Boolean).join(' '), city=ad.city||ad.town||ad.village||ad.hamlet||'';
        if(!S.f.address) S.f.address=st?st+(city?', '+city:''):(x.display_name||'').split(',').slice(0,3).join(',');
        document.getElementById('toast').hidden=true; if(S.view==='new') render(); }).catch(function(){ document.getElementById('toast').hidden=true; if(S.view==='new') render(); }); },
      function(){ toast('Location permission was denied.'); },{enableHighAccuracy:true,timeout:12000}); }
  else if(a==='saveNew'){ var f=S.f, it=S.items.filter(function(i){return i.id===f.itemId;})[0];
    if(!f.address||!f.address.trim()){ toast('Enter the address.'); return; }
    S.me=f.tech; store('trapMe',f.tech);
    queue({fn:'trapSet',tech:f.tech,branch:f.branch,itemId:f.itemId,item:it?it.name:'Trap',qty:f.qty,address:f.address.trim(),lat:f.lat,lng:f.lng,target:f.target,job:(f.job||'').trim(),notes:(f.notes||'').trim(),every:+f.every||24});
    toast('Trap set — check due in '+(+f.every||24)+' hours'); go('home'); }
  else if(a==='check'){ var t=byId(b.getAttribute('data-id')); S.sel=t.id; S.c={tech:S.me&&S.techs.indexOf(S.me)>=0?S.me:t.tech,result:'',animal:t.target||'',count:1,keep:false,notes:''}; go('check'); }
  else if(a==='result'){ S.c.result=b.getAttribute('data-v'); render(); }
  else if(a==='animal'){ S.c.animal=b.getAttribute('data-v'); render(); }
  else if(a==='cinc'){ S.c.count++; render(); }
  else if(a==='cdec'){ S.c.count=Math.max(1,S.c.count-1); render(); }
  else if(a==='keep'){ S.c.keep=b.getAttribute('data-v')==='1'; render(); }
  else if(a==='saveCheck'){ var c=S.c, tr=byId(S.sel); S.me=c.tech; store('trapMe',c.tech);
    queue({fn:'trapCheck',trapId:S.sel,tech:c.tech,result:c.result,animal:c.animal,count:c.result==='Caught'?c.count:0,keep:!!c.keep,notes:(c.notes||'').trim()});
    var pulled=c.result==='Pulled'||(c.result==='Caught'&&!c.keep);
    toast(pulled?'Trap pulled \u2014 return it in Equipment when it\u2019s back at the shop':'Check saved — next one due in '+(tr?tr.every:24)+' hours'); go('home'); }
});
setInterval(function(){ if(S.view==='home') render(); },60000);
setInterval(function(){ if(S.view==='home') load(); },120000);
fromCache(); render(); load(); flush();
})();
</script>
</body>
</html>
