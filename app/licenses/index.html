 var items=[

function db(){ if(mem) return mem; try{ var r=ls(KEY); if(r) mem=JSON.parse(r); }catch(e){} if(!mem){ mem=seed(); save(); } return mem; }
function save(){ ls(KEY,JSON.stringify(mem)); }
function pin(p){ if(String(p)!==PIN) throw new Error('Wrong PIN. The demo PIN is 1234.'); }
function eq(){ var d=db(); return {items:d.items,techs:d.T}; }
function eqA(){ var d=db(); return {items:d.items,techs:d.T,log:d.eqLog.slice(0,40)}; }
function find(a,id){ return a.filter(function(x){return x.id===id;})[0]; }
function trapL(){ var d=db(); return {active:d.active,items:d.items,techs:d.T,log:d.trapLog}; }
function licD(){ var d=db(); return {rows:d.lic.map(function(r){ var x=Object.assign({},r), p=r.expires.split('-'), e=new Date(+p[0],p[1]-1,+p[2]), n=new Date(); n.setHours(0,0,0,0); x.days=Math.round((e-n)/DAY); return x; }),techs:d.T.map(function(t){ var p=d.people.filter(function(q){return q.name===t;})[0]; return {name:t,branch:p?p.branch:''}; }),email:d.licEmail,days:d.licDays,sheetUrl:''}; }
function pric(){ var d=db(); return {rows:d.prices,updated:d.updated,footer:'Sample prices for this demo. Each company enters its own.'}; }
function shop(br){ var d=db(); return {products:d.stock[br]||[],techs:d.T,log:d.shopLog.slice(0,60),email:d.email,sheetUrl:''}; }

 getDirectory:function(){ return {people:db().people,sheetUrl:''}; },
 eqList:eq,
 eqOut:function(tech,item,qty,note,when,key){ var d=db(), it=find(d.items,item); it.out.push({id:'h'+key,tech:tech,qty:+qty,since:when,note:note}); d.eqLog.unshift({when:when,who:tech,action:'Checked out',qty:qty,item:it.name,note:note}); save(); return true; },
 eqIn:function(hold,qty,note,when){ var d=db(); d.items.forEach(function(it){ it.out=it.out.filter(function(o){ if(o.id!==hold) return true; o.qty-=+qty; d.eqLog.unshift({when:when,who:o.tech,action:'Returned',qty:qty,item:it.name,note:note}); return o.qty>0; }); }); save(); return true; },

  if(action==='add') d.items.push({id:'e'+Date.now().toString(36),name:x.name,total:Math.max(0,+x.total||0),out:[]});

  if(action==='delete') d.items=d.items.filter(function(i){return i.id!==x.id;});

  d.active.push({id:'T'+key.slice(-10),branch:branch,tech:tech,itemId:itemId,item:it.name,qty:+qty,address:address||'Address not entered',lat:lat,lng:lng,target:target,job:job,notes:notes,setAt:when,every:+every,lastCheck:null,nextDue:when+every*HR,status:'Active',catches:0});

  else { t.lastCheck=when; t.nextDue=when+t.every*HR; if(result==='Caught') t.catches+=(+count||1); }
  d.trapLog.unshift({when:when,tech:tech,action:result,animal:animal,count:count,address:t.address,notes:notes}); save(); return true; },
 getPricing:pric,

 pricingSave:function(p,rows){ pin(p); var d=db(); d.prices=rows; d.updated=new Date().toLocaleDateString(); save(); return pric(); },
 licUnlock:function(){ return licD(); },

 licDelete:function(p,id){ var d=db(); d.lic=d.lic.filter(function(x){return x.id!==id;}); save(); return licD(); },
 licSettings:function(p,email,days){ var d=db(); d.licEmail=email; d.licDays=days; save(); return licD(); },
 licTest:function(p){ return {sent:0,note:'Demo only: no email was sent. The live version emails this reminder.'}; },

 returnItems:function(br,tech,items,when){ var d=db(); items.forEach(function(i){ var p=find(d.stock[br],i.id); if(p){ p.qty+=i.qty; d.shopLog.unshift({when:when,who:tech,action:'Returned',product:p.name,qty:i.qty,unit:p.unit}); } }); save(); return true; },

 adminSaveProduct:function(br,p,x){ pin(p); var d=db(), a=d.stock[br], o=x.id?find(a,x.id):null; if(o) Object.assign(o,x,{qty:+x.qty,reorderAt:+x.reorderAt}); else a.push(Object.assign({},x,{id:'p'+Date.now().toString(36),qty:+x.qty||0,reorderAt:+x.reorderAt||0})); save(); return shop(br); },
 adminRestock:function(br,p,id,add){ pin(p); var d=db(), o=find(d.stock[br],id); o.qty+=(+add||0); d.shopLog.unshift({when:Date.now(),who:'Manager',action:'Restocked',product:o.name,qty:+add||0,unit:o.unit}); save(); return shop(br); },
 adminDeleteProduct:function(br,p,id){ pin(p); var d=db(); d.stock[br]=d.stock[br].filter(function(x){return x.id!==id;}); save(); return shop(br); },
 adminAddTech:function(br,p,n){ pin(p); var d=db(); if(d.T.indexOf(n)<0) d.T.push(n); save(); return shop(br); },
 adminRemoveTech:function(br,p,n){ pin(p); var d=db(); d.T=d.T.filter(function(x){return x!==n;}); save(); return shop(br); },
 adminSettings:function(br,p,em){ pin(p); var d=db(); if(em!=null) d.email=em; save(); return shop(br); }
};

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 200px;width:auto}.bar select{width:auto;flex:0 1 auto}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 90px;min-width:0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left}
.stat .v{font-family:var(--mono);font-size:1.6rem}
.stat.crit .v{color:var(--crit)}.stat.warn .v{color:var(--warn)}.stat.ok .v{color:var(--ok)}
.stat[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card h3{margin:0;padding:12px 16px;font:700 1.3rem/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.card h3 small{font:600 .8rem var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.lic{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.lic:first-of-type{border-top:0}
.st{font:700 1.05rem var(--display);width:46px;height:46px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);letter-spacing:.04em}
.lic .main b{font-weight:600}.lic .main div{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.lic .num{font-family:var(--mono);font-size:.88rem}
.pill{display:inline-block;align-self:center;justify-self:end;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;text-align:center}
.pill.ok{background:var(--accent-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.none{background:var(--sunk);color:var(--muted)}
.right{display:grid;gap:6px;justify-items:end}
.prof{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.prof .ph{display:flex;align-items:center;gap:12px;padding:14px 16px}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1.2rem var(--display);flex:none}
.prof .ph b{display:block;font:700 1.35rem/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.prof .ph small{color:var(--muted);font-size:.88rem}
.prof .ph .pill{margin-left:auto}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--line);text-align:left}
.lrow:hover{background:var(--sunk)}
.st{font:700 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:76px;text-align:center}
.lrow .num{font-family:var(--mono);font-size:.92rem;font-weight:600}
.lrow .ex{color:var(--muted);font-size:.85rem}
.addmore{display:block;width:100%;padding:12px 16px;border-top:1px solid var(--line);text-align:left;color:var(--ok);font-weight:600;font-size:.92rem}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.box p{margin:0;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
.pin{flex:1;display:grid;place-items:center}
.pin form{display:grid;gap:14px;width:min(100%,320px);text-align:center}
.pin input{text-align:center;font-family:var(--mono);font-size:1.8rem;letter-spacing:.4em}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.5rem;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
@media (max-width:520px){.lic .right{grid-column:1/-1;justify-items:start;grid-auto-flow:column;justify-content:space-between}}
</style>
</head>

<script>

var BRANCHES=['North Branch','South Branch','East Branch'];
var STATES=[['TX','Texas'],['OK','Oklahoma'],['LA','Louisiana']];
function stName(c){ c=String(c||'').toUpperCase(); var m=STATES.filter(function(s){return s[0]===c;})[0]; return m?m[1]:(c||''); }
var RANK={crit:0,warn:1,ok:2,none:3};
var app=document.getElementById('app');
var S={view:'loading',pin:'',busy:false,d:null,tab:'list',q:'',branch:'all',filter:'all',edit:null,confirm:null};
function api(fn){ var args=[].slice.call(arguments,1);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){ if(!r.ok) throw new Error('Server error '+r.status); return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'Something went wrong.'); return j.data; })
    .catch(function(e){ throw (e instanceof TypeError ? new Error('No connection. Check Wi-Fi or data.') : e); }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function msg(e){ return (e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,''); }
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(function(){el.hidden=true;},3000); }
function soonDays(){ var m=String(S.d&&S.d.days||'60').split(',').map(Number); return Math.max.apply(null,m.concat([30])); }
function status(r){ if(r.days===null||r.days===undefined||r.expires==='') return 'none'; if(r.days<0) return 'crit'; if(r.days<=soonDays()) return 'warn'; return 'ok'; }
function pillText(r){ var s=status(r); if(s==='none') return 'No date';
  if(r.days<0) return 'Expired '+(-r.days)+'d ago'; if(r.days===0) return 'Expires today'; if(s==='warn') return r.days+' days left'; return 'Valid'; }
function fmtDate(s){ if(!s) return '—'; var p=s.split('-'); return +p[1]+'/'+(+p[2])+'/'+p[0]; }
function header(right){ return '<a class="back" href="../index.html">← All tools</a><div class="top"><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Licenses</b><span class="eyebrow">Applicator licenses &amp; renewals</span></div></div>'+(right||'')+'</div>'; }

function vPin(){
  return header('')+'<div class="pin"><form id="pinForm"><span class="eyebrow">Manager PIN</span><input id="pinIn" placeholder="Demo PIN: 1234" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">'+
    '<button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button><p class="eyebrow" style="text-transform:none;letter-spacing:0">License numbers are private, so this tool is locked.</p></form></div>';
}
function vMain(){
  var tabs='<div class="tabs" role="tablist">'+[['list','Licenses'],['add',S.edit&&S.edit.id?'Edit license':'Add license'],['settings','Reminders']].map(function(t){
    return '<button class="tab" role="tab" aria-selected="'+(S.tab===t[0])+'" data-a="tab" data-t="'+t[0]+'">'+t[1]+'</button>'; }).join('')+'</div>';
  return header('')+tabs+({list:vList,add:vForm,settings:vSettings})[S.tab]();
}
function vList(){
  var rows=S.d.rows, q=S.q.toLowerCase();
  var c={crit:0,warn:0,ok:0,none:0}; rows.forEach(function(r){ c[status(r)]++; });
  var f=rows.filter(function(r){ return (S.branch==='all'||r.branch===S.branch) && (S.filter==='all'||status(r)===S.filter) &&
    (!q||[r.tech,r.state,stName(r.state),r.type,r.number,r.notes].join(' ').toLowerCase().indexOf(q)>=0); });
  var by={},order=[]; f.sort(function(a,b){ return a.tech.localeCompare(b.tech)||((a.days==null?99999:a.days)-(b.days==null?99999:b.days)); })
    .forEach(function(r){ if(!by[r.tech]){ by[r.tech]=[]; order.push(r.tech); } by[r.tech].push(r); });
  var stats='<div class="stats">'+[['crit','Expired'],['warn','Due soon'],['ok','Valid']].map(function(s){
    return '<button class="stat '+s[0]+'" data-a="filter" data-f="'+s[0]+'" aria-pressed="'+(S.filter===s[0])+'"><div class="v">'+c[s[0]]+'</div><span class="eyebrow">'+s[1]+'</span></button>'; }).join('')+'</div>';
  var bar='<div class="bar"><input type="search" id="q" placeholder="Search tech or license #" value="'+esc(S.q)+'">'+

    (S.filter!=='all'?'<button class="btn sm" data-a="filter" data-f="all">Show all</button>':'')+'</div>';
  var list=order.map(function(t){ var rs=by[t], worst=rs.slice().sort(function(x,y){ return RANK[status(x)]-RANK[status(y)]; })[0];
    var ws=status(worst), initials=t.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase();
    var summary=ws==='crit'?'<span class="pill crit">'+(rs.filter(function(r){return status(r)==='crit';}).length)+' expired</span>':
      ws==='warn'?'<span class="pill warn">Renewal due</span>':ws==='ok'?'<span class="pill ok">All valid</span>':'';
    return '<section class="prof"><div class="ph"><div class="av">'+esc(initials)+'</div><div><b>'+esc(t)+'</b><small>'+rs.length+' license'+(rs.length===1?'':'s')+'</small></div>'+summary+'</div>'+
      rs.map(function(r){ var s=status(r);
        return '<button class="lrow" data-a="edit" data-id="'+r.id+'" aria-label="Edit '+esc(stName(r.state)||'license')+' license"><span class="st">'+esc(stName(r.state)||'—')+'</span>'+
          '<span><span class="num">'+(r.number?'#'+esc(r.number):'No license #')+'</span><br><span class="ex">Expires '+fmtDate(r.expires)+'</span></span>'+
          '<span class="pill '+s+'">'+pillText(r)+'</span></button>';
      }).join('')+
      '<button class="addmore" data-a="addFor" data-t="'+esc(t)+'">+ Add another license for '+esc(t.split(' ')[0])+'</button></section>'; }).join('');
  if(!rows.length) list='<div class="empty"><b>No licenses yet</b>Tap “Add license” to enter the first one.</div>';
  else if(!f.length) list='<div class="empty">No licenses match.</div>';
  return stats+bar+'<div style="display:grid;gap:14px">'+list+'</div>'+
    (rows.length?'<p class="eyebrow" style="text-transform:none;letter-spacing:0;margin:0">Tap a license to edit or remove it.</p>':'')+
    (S.d.sheetUrl?'<p class="eyebrow" style="text-transform:none;letter-spacing:0">Everything is also in the <a href="'+esc(S.d.sheetUrl)+'" target="_blank" rel="noopener">Licenses tab of your Google Sheet</a>.</p>':'');
}
function vForm(){
  var r=S.edit||{tech:'',branch:'',state:'TX',type:'',number:'',expires:'',email:'',notes:''};
  var techs=S.d.techs.map(function(t){ return '<option value="'+esc(t.name)+'">'+esc(t.branch)+'</option>'; }).join('');
  var st=String(r.state||'').toUpperCase();
  return '<form class="box" id="licForm"><div class="form" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">'+
    '<label>Tech name<input name="tech" list="techList" required value="'+esc(r.tech)+'" autocomplete="off"></label><datalist id="techList">'+techs+'</datalist>'+
    '<label>State<select name="state" required><option value="">Choose…</option>'+STATES.map(function(x){ return '<option value="'+x[0]+'"'+(st===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('')+'</select></label>'+
    '<label>License #<input name="number" value="'+esc(r.number)+'" autocomplete="off"></label>'+
    '<label>Expiration date<input name="expires" type="date" required value="'+esc(r.expires)+'"></label>'+
    '</div><div class="bar" style="justify-content:flex-end">'+(S.edit?'<button class="btn" type="button" data-a="cancelEdit">Cancel</button>':'')+
    '<button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Saving…':(S.edit&&S.edit.id?'Save changes':'Add license'))+'</button></div>'+
    (S.edit&&S.edit.id?'<div class="bar" style="border-top:1px solid var(--line);padding-top:12px">'+(S.confirm===S.edit.id?'<span>Remove this license?</span><button class="btn danger sm" type="button" data-a="del" data-id="'+S.edit.id+'">Yes, remove</button><button class="btn sm" type="button" data-a="noconf">Keep</button>':
      '<button class="btn ghost sm" type="button" data-a="conf" data-id="'+S.edit.id+'">Remove this license</button>')+'</div>':'')+'</form>';
}
function vSettings(){
  return '<div class="box"><h3 style="margin:0;font:700 1.3rem var(--display);text-transform:uppercase">Reminder emails</h3>'+
    '<p>Every morning at 7am the system checks expiration dates. When a license hits one of the reminder points below, it emails the address here. Each reminder point is sent once per license.</p>'+
    '<form id="setForm" class="form"><label>Send reminders to<input name="email" type="email" value="'+esc(S.d.email)+'"></label>'+
    '<label>Days before expiration<input name="days" value="'+esc(String(S.d.days).replace(/,/g,', '))+'" placeholder="60, 30, 14, 7, 0"></label>'+
    '<div class="wide bar" style="justify-content:flex-end"><button class="btn" type="button" data-a="test">Send test email now</button><button class="btn primary" type="submit">Save</button></div></form></div>';
}
function render(){ app.innerHTML=S.view==='loading'?header('')+'<div class="empty">'+(S.err?esc(S.err)+'<br><br><button class="btn" data-a="retry">Try again</button>':'Loading licenses…')+'</div>':vMain(); }
function load(){ S.err='';
  try{ var c=JSON.parse(localStorage.getItem('licCache')||'null'); if(c&&c.rows){ S.d=c; S.view='main'; } }catch(_){}
  render();
  api('licUnlock','').then(function(d){ var busy=S.tab!=='list'; apply(d); S.view='main'; if(!busy) render(); })
    .catch(function(err){ if(S.view!=='main'){ S.err=msg(err); render(); } }); }
function apply(d){ S.d=d; try{ localStorage.setItem('licCache',JSON.stringify(d)); }catch(_){} }

app.addEventListener('submit',function(e){
  e.preventDefault(); var f=e.target;
  if(f.id==='pinForm'){ var pin=document.getElementById('pinIn').value; if(!pin) return; S.busy=true; render();
    api('licUnlock',pin).then(function(d){ S.busy=false; S.pin=pin; apply(d); S.view='main'; render(); }).catch(function(err){ S.busy=false; render(); toast(msg(err)); }); }
  else if(f.id==='licForm'){ var fd=new FormData(f), r={};
    if(S.edit&&S.edit.id){ ['branch','type','email','notes'].forEach(function(k){ r[k]=S.edit[k]||''; }); r.id=S.edit.id; }
    fd.forEach(function(v,k){ r[k]=v; });
    if(!r.branch){ var t=S.d.techs.filter(function(x){return x.name.toLowerCase()===r.tech.trim().toLowerCase();})[0]; if(t) r.branch=t.branch; }
    S.busy=true; render();
    api('licSave',S.pin,r).then(function(d){ S.busy=false; apply(d); var was=!!(S.edit&&S.edit.id); S.edit=null; S.tab='list'; render(); toast(was?'License updated.':'License added.'); })
      .catch(function(err){ S.busy=false; render(); toast(msg(err)); }); }
  else if(f.id==='setForm'){ var g=new FormData(f);
    api('licSettings',S.pin,g.get('email'),g.get('days'),'').then(function(d){ apply(d); render(); toast('Reminder settings saved.'); })
      .catch(function(err){ toast(msg(err)); }); }
});
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ S.q=e.target.value; var pos=e.target.selectionStart; render(); var n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
});
app.addEventListener('change',function(e){
  if(e.target.id==='br'){ S.branch=e.target.value; render(); }
  if(e.target.name==='tech'){ var t=S.d.techs.filter(function(x){return x.name.toLowerCase()===e.target.value.trim().toLowerCase();})[0];
 }
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return; var a=b.getAttribute('data-a'), id=b.getAttribute('data-id');
  if(a==='tab'){ S.tab=b.getAttribute('data-t'); if(S.tab!=='add') S.edit=null; S.confirm=null; render(); }
  else if(a==='retry'){ load(); }
  else if(a==='filter'){ var f=b.getAttribute('data-f'); S.filter=(S.filter===f?'all':f); render(); }
  else if(a==='edit'){ S.edit=Object.assign({},S.d.rows.filter(function(r){return r.id===id;})[0]); S.tab='add'; render(); window.scrollTo(0,0); }
  else if(a==='addFor'){ S.edit={tech:b.getAttribute('data-t'),state:'',number:'',expires:''}; S.tab='add'; S.confirm=null; render(); window.scrollTo(0,0); }
  else if(a==='cancelEdit'){ S.edit=null; S.tab='list'; render(); }
  else if(a==='conf'){ S.confirm=id; render(); }
  else if(a==='noconf'){ S.confirm=null; render(); }
  else if(a==='del'){ api('licDelete',S.pin,id).then(function(d){ apply(d); S.confirm=null; S.edit=null; S.tab='list'; render(); toast('License removed.'); }).catch(function(err){ toast(msg(err)); }); }
  else if(a==='test'){ toast('Sending…'); api('licTest',S.pin).then(function(r){ toast(r.sent?'Test email sent ('+r.sent+' license'+(r.sent===1?'':'s')+').':r.note); }).catch(function(err){ toast(msg(err)); }); }
});
load();
})();
</script>
</body>
</html>
