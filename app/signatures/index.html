<title>Signed Documents</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f6f4;--surface:#fff;--sunk:#e6ecE8;--ink:#1f2324;--muted:#55635a;--line:#d5dfd8;--accent:#046725;--accent-ink:#ffffff;--accent-soft:#e4f1e8;--ok:#067a2e;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font:700 2rem/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:700 1.3rem/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h3{font:700 1.08rem/1.25 var(--body);margin:14px 0 4px}
a{color:var(--ok)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.err{color:#b3261e;font-weight:600;margin:0}
.ok{color:var(--ok);font-weight:600;margin:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.link{background:none;border:0;color:var(--ok);font-weight:600;cursor:pointer;padding:0}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:grid;gap:12px;max-width:440px}
.lock input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.2rem var(--body)}
input[type=search]{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.start{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.start h2 a{color:inherit;text-decoration:none}
.chap{margin:4px 0 0;padding-left:22px;columns:2 220px;column-gap:24px}
.chap li{margin:0 0 6px;break-inside:avoid}
.chap a{color:var(--ink);text-decoration:none;font-weight:500}
.lib{margin-top:6px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;text-decoration:none;color:var(--ink);min-height:84px;align-content:start}
.doc b{font-weight:700;line-height:1.25}
.doc span{font-size:.85rem;color:var(--muted)}
.hits{display:grid;gap:8px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.hit .where{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hit .snip{font-size:.95rem}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tools select{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font:inherit;color:inherit}
.intro{display:grid;gap:4px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.sec>summary{cursor:pointer;list-style:none;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font:700 1.15rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:1.4rem;color:var(--muted);flex:none}
details.sec[open]>summary::after{content:"–"}
details.sec .body{padding:0 16px 16px}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin:0 0 6px}
.say{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 10px;display:grid;gap:8px}
.say p{margin:0;font-style:italic}
.copy{justify-self:start;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink)}
.note{border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 10px}
.note.warn{border-left-color:#b3261e}
.note.warn b{color:#b3261e}
details.qa{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:var(--bg)}
details.qa summary{cursor:pointer;padding:12px 14px;font-weight:600}
details.qa p{padding:0 14px 12px;margin:0}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:2px 10px;margin:0}
.steps li::before{content:counter(s);grid-row:span 2;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1.2rem var(--display)}
.steps li span{color:var(--muted)}
.never{list-style:none;padding:0}
.never li{padding-left:26px;position:relative;color:#b3261e;font-weight:600}
.never li::before{content:"✕";position:absolute;left:4px}
.check{list-style:none;padding:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ok)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.tw{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--ink);color:var(--bg);text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:120px}
td:first-child{font-weight:600}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.pn{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:.92rem}
.pn a{text-decoration:none;max-width:48%}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.imp .file{position:relative;overflow:hidden;justify-self:start}
.imp .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.soonc{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;display:grid;gap:4px}
.soonc b{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.soonc span:last-child{color:var(--muted);font-size:.92rem}
.pill{justify-self:start;background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.doc .ok,.doc .need{font-size:.8rem;font-weight:600}
.doc .need{color:#b3261e}
.small{font-size:.85rem}
.pol{gap:4px}
.pol .ph{font:700 1.1rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 2px}
.pol .ph:first-child{margin-top:0}
.kv li b{display:block}
.signbox{gap:14px;border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ok)}
.fld{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.fld input{min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:500 1.05rem var(--body);color:var(--ink)}
.pad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;height:170px}
.pad canvas{width:100%;height:100%;display:block;touch-action:none;border-radius:10px;cursor:crosshair}
.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#8a8f86;font-weight:500;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);min-height:52px;font-size:1.05rem}
.done{border-color:var(--ok)}
.done .btn{justify-self:start}

.hbc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.hbc b{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.hbc .hbs{color:var(--muted);font-size:.92rem}
.pol .ph3{font-weight:700;font-size:1rem;margin:12px 0 0}
.pol h2.ph{scroll-margin-top:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.pol h2.ph:first-child{border-top:0;padding-top:0;margin-top:0}
.toc h2{font:700 1.1rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
.toc ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.hbc .need{color:#b3261e;font-size:.8rem;font-weight:600}
.hbc .ok{font-size:.8rem}
.toc .link{text-align:left;padding:4px 0}
.pdfl{color:var(--ok);font-weight:600}
#sign{scroll-margin-top:12px}
.totop{margin:0;text-align:right}
.tblw{overflow-x:auto}
.tblw table{border-collapse:collapse;width:100%;font-size:.92rem}
.tblw th,.tblw td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tblw th{background:var(--sunk)}
@media (max-width:600px){.tblw thead{display:none}.tblw tr{display:block;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;padding:4px 0}.tblw td{display:block;border:0;padding:3px 10px}.tblw td:before{content:attr(data-h)": ";font-weight:600}.tblw td:first-child{font-weight:700}.tblw td:first-child:before{content:""}}
.fld select,.fld input,.fld textarea{width:100%;min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 1.05rem var(--body)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two .fld,.two input{min-width:0;max-width:100%}
.form{gap:14px}
.warnbox{border-left:4px solid #b3261e;background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.95rem}
.okbox{border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.95rem}
.req{gap:6px}
.req .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.req .row b{font-size:1.05rem;line-height:1.25}
.req .meta{color:var(--muted);font-size:.92rem}
.st{flex:none;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:700;background:var(--sunk);color:var(--ink)}
.st.Approved{background:var(--accent-soft);color:var(--ok)}
.st.Denied{background:#fbe4e2;color:#b3261e}
.strike{color:#b3261e;font-weight:600;font-size:.9rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.acts .btn{flex:1 1 130px}
.btn.deny{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.lock h2{margin:0}
.list{display:grid;gap:10px}
.chk.fr{margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.fld textarea{padding:10px 12px;resize:vertical}
.sum{display:grid;gap:2px}.sum b{font:700 2rem/1 var(--display)}.dl{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}.dr{display:flex;justify-content:space-between;gap:12px;margin:0;font-size:.95rem}.dr .s{flex:none;font-weight:600;text-align:right;max-width:50%}.s.ok,.s.ok a{color:var(--ok)}.s.no{color:#b3261e}.s.old,.s.old a{color:#a96d12}
</style>
</head>

<div id="app"></div>
<script>
var MARK='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9Ii0yMzYgLTIzNiA0NzIgNDcyIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlBlc3RIdWIiPjxwb2x5Z29uIHBvaW50cz0iMC4wLC0yMDAuMCAxNzMuMiwtMTAwLjAgMTczLjIsMTAwLjAgMC4wLDIwMC4wIC0xNzMuMiwxMDAuMCAtMTczLjIsLTEwMC4wIiBmaWxsPSIjMDQ2NzI1IiBzdHJva2U9IiMwNDY3MjUiIHN0cm9rZS13aWR0aD0iMTQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz48Y2lyY2xlIGN4PSIwLjAiIGN5PSItMjAwLjAiIHI9IjMzIiBmaWxsPSIjZmZmZmZmIi8+PGNpcmNsZSBjeD0iMC4wIiBjeT0iLTIwMC4wIiByPSIyNSIgZmlsbD0iIzA0NjcyNSIvPjxjaXJjbGUgY3g9IjE3My4yIiBjeT0iLTEwMC4wIiByPSIzMyIgZmlsbD0iI2ZmZmZmZiIvPjxjaXJjbGUgY3g9IjE3My4yIiBjeT0iLTEwMC4wIiByPSIyNSIgZmlsbD0iIzA0NjcyNSIvPjxjaXJjbGUgY3g9IjE3My4yIiBjeT0iMTAwLjAiIHI9IjMzIiBmaWxsPSIjZmZmZmZmIi8+PGNpcmNsZSBjeD0iMTczLjIiIGN5PSIxMDAuMCIgcj0iMjUiIGZpbGw9IiMwNDY3MjUiLz48Y2lyY2xlIGN4PSIwLjAiIGN5PSIyMDAuMCIgcj0iMzMiIGZpbGw9IiNmZmZmZmYiLz48Y2lyY2xlIGN4PSIwLjAiIGN5PSIyMDAuMCIgcj0iMjUiIGZpbGw9IiMwNDY3MjUiLz48Y2lyY2xlIGN4PSItMTczLjIiIGN5PSIxMDAuMCIgcj0iMzMiIGZpbGw9IiNmZmZmZmYiLz48Y2lyY2xlIGN4PSItMTczLjIiIGN5PSIxMDAuMCIgcj0iMjUiIGZpbGw9IiMwNDY3MjUiLz48Y2lyY2xlIGN4PSItMTczLjIiIGN5PSItMTAwLjAiIHI9IjMzIiBmaWxsPSIjZmZmZmZmIi8+PGNpcmNsZSBjeD0iLTE3My4yIiBjeT0iLTEwMC4wIiByPSIyNSIgZmlsbD0iIzA0NjcyNSIvPjxnIHRyYW5zZm9ybT0ic2NhbGUoMS4yNSkiPjxwYXRoIGQ9Ik0wLTEwNCA4Ni03NFYzNEwwIDEwNi04NiAzNFYtNzRaIiBmaWxsPSIjZmZmZmZmIi8+PGcgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMCAwKSBzY2FsZSgxKSI+PGcgc3Ryb2tlPSIjMWYyMzI0IiBzdHJva2Utd2lkdGg9IjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgZmlsbD0ibm9uZSI+PHBhdGggZD0iTS04LTQ0LTE0LTU4LTIyLTYwTTgtNDQgMTQtNTggMjItNjBNLTI3LTYtNDYtMTYtNTAtMjhNLTMxIDE0SC01MkwtNTggNE0tMjcgMzQtNDQgNDYtNDYgNjBNMjctNiA0Ni0xNiA1MC0yOE0zMSAxNEg1Mkw1OCA0TTI3IDM0IDQ0IDQ2IDQ2IDYwIi8+PC9nPjxwYXRoIGQ9Ik0tMTUtMzBBMTUgMTUgMCAwIDEgMTUtMzBWLTI2SC0xNVoiIGZpbGw9IiMxZjIzMjQiLz48ZWxsaXBzZSBjeD0iMCIgY3k9IjE0IiByeD0iMzMiIHJ5PSI0MSIgZmlsbD0iIzFmMjMyNCIvPjxwYXRoIGQ9Ik0wLTI2VjU0IiBzdHJva2U9IiNmZmZmZmYiIHN0cm9rZS13aWR0aD0iMyIvPjwvZz48L2c+PC9zdmc+';
(function(){
var API_URL='demo-api';
var app=document.getElementById('app'),S={docs:null,people:null,others:[],f:'missing',err:'',busy:false};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
function vk(v){var d=Date.parse(v);return isNaN(d)?String(v):new Date(d).toDateString();}
function nk(s){return String(s||'').replace(/\s+/g,' ').trim().toLowerCase();}
function day(ms){return ms?new Date(ms).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):'';}
function head(){return '<a class="back" href="../index.html#mgmt">← Management</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Signed Documents</b><span class="eyebrow">Who has signed what</span></div></div>';}
function policies(){return fetch('../policies/index.html?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var re=/\{\s*"?id"?\s*:\s*['"]([^'"]+)['"]\s*,\s*"?title"?\s*:\s*['"](.+?)['"]\s*,\s*"?version"?\s*:\s*['"](.+?)['"]/g,m,out=[];while((m=re.exec(t)))out.push({id:m[1],title:m[2].replace(/\\'/g,"'"),version:m[3]});if(!out.length)throw new Error('Could not read the required documents.');return out;});}
function build(docs,d){var skip=/vendor|supplier|partner/i,seen={},known={},byName={};
  d.sigs.forEach(function(x){var k=nk(x.name);(byName[k]=byName[k]||[]).push(x);});
  var people=d.people.filter(function(p){return !skip.test(p.section||'');}).filter(function(p){var k=nk(p.name);if(seen[k])return false;seen[k]=1;return true;}).map(function(p){var mine=byName[nk(p.name)]||[];known[nk(p.name)]=1;
    var rows=docs.map(function(x){var cur=null,old=null;mine.forEach(function(g){if(nk(g.policy)!==nk(x.title))return;if(vk(g.version)===vk(x.version)){if(!cur||g.when>cur.when)cur=g;}else if(!old||g.when>old.when)old=g;});return {title:x.title,state:cur?'ok':old?'old':'no',sig:cur||old};});
    return {name:p.name,branch:p.branch,role:p.role,rows:rows,missing:rows.filter(function(r){return r.state!=='ok';}).length};});
  people.sort(function(a,b){return (b.missing-a.missing)||a.name.localeCompare(b.name);});
  var others={};d.sigs.forEach(function(x){var k=nk(x.name);if(known[k])return;var o=others[k]=others[k]||{name:x.name,sigs:[]};o.sigs.push(x);});
  S.docs=docs;S.people=people;S.others=Object.keys(others).map(function(k){return others[k];});}
function load(){S.busy=true;S.err='';render();Promise.all([policies(),api('polStatus',[])]).then(function(r){build(r[0],r[1]);S.busy=false;render();}).catch(function(x){S.busy=false;S.err=String(x.message||x);render();});}
function row(r){var txt=r.state==='ok'?'Signed '+day(r.sig.when):r.state==='old'?'Old version, signed '+day(r.sig.when):'Not signed';
  var inner=r.sig&&r.sig.url?'<a href="'+esc(r.sig.url)+'" target="_blank" rel="noopener">'+esc(txt)+'</a>':esc(txt);
  return '<li class="dr"><span>'+esc(r.title)+'</span><span class="s '+r.state+'">'+inner+'</span></li>';}
function person(p){return '<section class="card req"><div class="row"><b>'+esc(p.name)+'</b><span class="st '+(p.missing?'Denied':'Approved')+'">'+(p.missing?p.missing+' to sign':'All signed')+'</span></div>'+(p.role||p.branch?'<span class="meta">'+esc([p.role,p.branch].filter(Boolean).join(' · '))+'</span>':'')+'<ul class="dl">'+p.rows.map(row).join('')+'</ul></section>';}
function view(){var h=head();
  if(!S.people)return h+(S.busy?'<p class="muted">Loading…</p>':'<p class="err">'+esc(S.err)+'</p>');
  var P=S.people,miss=P.filter(function(p){return p.missing;}),done=P.length-miss.length;
  var F=[['missing','Needs signatures',miss.length],['done','All signed',done],['all','Everyone',P.length]];
  h+='<div class="sum"><b>'+done+' of '+P.length+'</b><span class="meta">employees have signed all '+S.docs.length+' required documents</span></div>';
  h+='<div class="chips">'+F.map(function(x){return '<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(S.f===x[0])+'">'+x[1]+' ('+x[2]+')</button>';}).join('')+'</div>';
  var l=P.filter(function(p){return S.f==='all'||(S.f==='done'?!p.missing:p.missing);});
  h+=l.length?'<div class="list">'+l.map(person).join('')+'</div>':'<p class="muted">Nobody here.</p>';
  if(S.others.length)h+='<h2 class="lib">Signed under another name</h2><p class="muted small">These names aren\'t in the Directory. It may be a nickname or a typo, so they aren\'t counted above.</p><div class="list">'+S.others.map(function(o){return '<section class="card req"><b>'+esc(o.name)+'</b><ul class="dl">'+o.sigs.map(function(g){return row({title:g.policy,state:'ok',sig:g});}).join('')+'</ul></section>';}).join('')+'</div>';
  h+='<p class="muted small">Names come from the Directory. Tap a date to open the signed PDF.</p>';
  return h;}
function render(){app.innerHTML=view();}
app.addEventListener('click',function(e){var t=e.target.closest('button');if(t&&t.dataset.f){S.f=t.dataset.f;render();}});
load();
})();
</script>
