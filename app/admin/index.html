<script>
(function(){

function mgmtPin(){try{var p=sessionStorage.getItem('mgmt.pin'),u=+sessionStorage.getItem('mgmt.until'),t=+sessionStorage.getItem('mgmt.ttl')||18e5;if(p&&u>Date.now()){sessionStorage.setItem('mgmt.until',String(Date.now()+t));return p;}sessionStorage.removeItem('mgmt.pin');sessionStorage.removeItem('mgmt.until');}catch(e){}return '';}

var S={pin:mgmtPin(),by:ls('to.by')||'',d:null,tab:'people',busy:false,err:'',msg:'',names:null,asking:false,edit:null,tileG:'ops',tileEdit:'',T:null,P:null,draft:{}};

/* ---- Employees ---- */
function peopleTab(){var d=S.d;if(S.edit)return personForm();var l=d.people.slice().sort(function(a,b){var x=a.status==='Inactive'?1:0,y=b.status==='Inactive'?1:0;return x-y||(a.name<b.name?-1:1);});

function tileForm(x,t){var locked=x==='admin/index.html',me=x==='me/index.html';return '<div class="two">'+fld('Name','t_n',t.name,'text','data-t="name"')+fld('Description','t_s',t.sub,'text','data-t="sub"')+'</div>'+(locked||me?'<p class="muted small">'+(locked?'Admin always stays in Management so you can\'t lock yourself out.':'My Dashboard is a home screen button and can\'t be hidden or moved.')+'</p>':'<div class="chips">'+Object.keys(GR).map(function(k){return '<label class="chk"><input type="checkbox" data-tg="'+k+'"'+(t.groups.indexOf(k)>=0?' checked':'')+'><span>'+GR[k]+'</span></label>';}).join('')+'</div><label class="chk"><input type="checkbox" data-th="1"'+(t.hidden?' checked':'')+'><span>Hide this tile from everyone</span></label>');}
/* ---- Emails ---- */
function emailsTab(){var d=S.d,e=d.emails,row=function(k,l){return fld(l,'e_'+k,e[k],'text','placeholder="'+esc(d.defaultEmail)+'"');};return '<form class="card" id="ef"><h2>Who gets which alerts</h2><p class="muted small">Separate more than one address with commas. Blank uses '+esc(d.defaultEmail)+'.</p>'+row('timeOff','New time off requests')+row('fieldRoutes','Schedule block and unblock reminders')+row('strikes','Strike alerts')+row('reviews','Employee review reminders')+fld('License renewal reminders','e_lic',d.licenseEmail)+'<h3>Shop restock and trap alerts by branch</h3>'+Object.keys(d.branches).map(function(k){return fld(d.branches[k],'e_b_'+k,d.alerts[k]);}).join('')+'<button class="btn primary"'+dis()+'>Save emails</button></form>';}
/* ---- Branches ---- */
function branchesTab(){var b=S.d.branches;return '<div class="list">'+Object.keys(b).map(function(k){return '<form class="card" data-f="br" data-c="'+esc(k)+'"><div class="row"><h3>Branch code '+esc(k)+'</h3></div><div class="line"><input id="b_'+esc(k)+'" value="'+esc(b[k])+'" aria-label="Branch name"><button class="btn soft tiny"'+dis()+'>Rename</button></div></form>';}).join('')+'</div><form class="card" data-f="bradd"><h2>Add a branch</h2><div class="two">'+fld('Branch name','b_new','')+fld('Short code (2 to 4 letters)','b_code','','text','maxlength="4"')+'</div><p class="note small">Adding a branch creates its shop tabs and adds it to Shop, Traps, Licenses and Onboarding. Renaming keeps its history. Employees\' Directory branch is typed separately on each employee.</p><button class="btn primary"'+dis()+'>Add branch</button></form>';}
/* ---- Rules ---- */
function rulesTab(){var r=S.draft.rules||(S.draft.rules=clone(S.d.rules));return '<form class="list" id="rf"><div class="warn"><b>These should match your written policy.</b> Changing a number here does not change the Handbook or Time Off policy employees signed. Update the policy too, or the app and the policy will disagree.</div><p class="note small">New rules apply going forward. Strikes already issued keep their expiration and deadlines, and requests already made keep the notice rule they were made under.</p>'+RULES.map(function(g){return '<div class="card"><h2>'+g[0]+'</h2>'+g[1].map(function(f){return fld(f[1],'r_'+f[0],r[f[0]],'number','inputmode="numeric"');}).join('')+'</div>';}).join('')+'<div class="card"><h2>Temporary employee PIN</h2>'+fld('New employees and PIN resets sign in with this','r_temp',r.tempPin,'text','inputmode="numeric" maxlength="8"')+'<p class="muted small">Anyone who hasn\'t picked their own PIN yet will use the new one right away. People with their own PIN aren\'t affected.</p></div><div class="card"><h2>Strike exceptions</h2><p class="muted small">Reasons a manager can pick for "No strike". Past decisions keep the reason they were given.</p><div class="list">'+r.exceptions.map(function(x,i){return '<div class="line"><input data-x="'+i+'" value="'+esc(x)+'" aria-label="Exception"><button type="button" class="btn soft tiny" data-a="xdel" data-i="'+i+'">Remove</button></div>';}).join('')+'</div><button type="button" class="btn soft" data-a="xadd">Add an exception</button></div><button class="btn primary"'+dis()+'>Save rules</button></form>';}
function grabRules(){var r=S.draft.rules;if(!r)return;RULES.forEach(function(g){g[1].forEach(function(f){var e=document.getElementById('r_'+f[0]);if(e)r[f[0]]=e.value;});});var t=document.getElementById('r_temp');if(t)r.tempPin=t.value;[].forEach.call(document.querySelectorAll('[data-x]'),function(e){r.exceptions[+e.getAttribute('data-x')]=e.value;});}
/* ---- Documents ---- */
function loadPol(){if(S.P||S.polLoading)return;S.polLoading=true;fetch('../policies/index.html?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){var re=/\{\s*"?id"?\s*:\s*['"]([^'"]+)['"]\s*,\s*"?title"?\s*:\s*['"](.+?)['"]\s*,\s*"?version"?\s*:\s*['"](.+?)['"]/g,m,out=[];while((m=re.exec(t)))out.push({id:m[1],title:m[2].replace(/\\'/g,"'"),version:m[3]});S.P=out;S.polLoading=false;render();}).catch(function(){S.polLoading=false;S.err='Could not read the documents.';render();});}
function docsTab(){loadPol();if(!S.P)return '<p class="muted">Loading documents…</p>';var d=S.draft.docs||(S.draft.docs=clone(S.d.docs||{})),secs={};S.d.people.forEach(function(p){if(p.section&&!/vendor|supplier|partner/i.test(p.section))secs[p.section]=1;});
  return '<p class="note small">Adding a new document or changing its wording still needs a developer. Here you choose who must sign and which versions count.</p><div class="list">'+S.P.map(function(p){var c=d[p.id]||{required:true,sections:[],accept:[]},vs=Object.keys((S.d.versions||{})[p.title]||{}).filter(function(v){return v!==p.version;});return '<div class="card" data-doc="'+esc(p.id)+'"><div class="row"><h3>'+esc(p.title)+'</h3><span class="tag">'+esc(p.version)+'</span></div><label class="chk"><input type="checkbox" data-dr="1"'+(c.required!==false?' checked':'')+'><span>Required</span></label><p class="muted small">Who must sign. Leave all off for everyone.</p><div class="chips">'+Object.keys(secs).map(function(s){return '<label class="chk"><input type="checkbox" data-ds="'+esc(s)+'"'+((c.sections||[]).indexOf(s)>=0?' checked':'')+'><span>'+esc(s)+'</span></label>';}).join('')+'</div>'+(vs.length?'<p class="muted small">Older signed versions that still count, so nobody has to re-sign:</p>'+vs.map(function(v){return '<label class="chk"><input type="checkbox" data-dv="'+esc(v)+'"'+((c.accept||[]).indexOf(v)>=0?' checked':'')+'><span>'+esc(v)+'</span></label>';}).join(''):'<p class="muted small">No older signed versions.</p>')+'</div>';}).join('')+'</div><div class="acts"><button class="btn primary" data-a="dsave"'+dis()+'>Save documents</button></div>';}
function grabDocs(){var o={};[].forEach.call(document.querySelectorAll('[data-doc]'),function(c){var pick=function(a){return [].filter.call(c.querySelectorAll('['+a+']'),function(e){return e.checked;}).map(function(e){return e.getAttribute(a);});};o[c.getAttribute('data-doc')]={required:c.querySelector('[data-dr]').checked,sections:pick('data-ds'),accept:pick('data-dv')};});return o;}
/* ---- Onboarding ---- */
function obDraft(){return S.draft.ob||(S.draft.ob=clone(S.d.onboarding));}
function obTab(){var o=obDraft(),WHO={owner:'Owner / office',tech:'Tech',supervisor:'Supervisor'},items=function(l,g){return l.map(function(it,i){return '<div class="line"><input data-ob="'+g+'" data-i="'+i+'" value="'+esc(it[1])+'" aria-label="Checklist item"><button type="button" class="btn soft tiny" data-a="obdel" data-g="'+g+'" data-i="'+i+'">Remove</button></div>';}).join('')+'<button type="button" class="btn soft tiny" data-a="obadd" data-g="'+g+'">Add item</button>';};
  return '<p class="note small">Changes apply to new checklists and to checklists still in progress, so a new item must be checked before an open checklist can be signed off. Checklists already signed off don\'t change.</p><div class="list">'+o.plan.map(function(g,gi){return '<div class="card"><div class="two"><label class="fld">When<input data-obf="phase" data-g="'+gi+'" value="'+esc(g.phase)+'"></label><label class="fld">Who does it<select data-obf="who" data-g="'+gi+'">'+Object.keys(WHO).map(function(k){return '<option value="'+k+'"'+(g.who===k?' selected':'')+'>'+WHO[k]+'</option>';}).join('')+'</select></label></div><label class="fld">Group name<input data-obf="group" data-g="'+gi+'" value="'+esc(g.group)+'"></label>'+items(g.items,gi)+'<button type="button" class="link" data-a="obgdel" data-g="'+gi+'">Remove this group</button></div>';}).join('')+'<button type="button" class="btn soft" data-a="obgadd">Add a group</button><div class="card"><h2>Final sign-off</h2>'+items(o.signoff,'s')+'</div></div><div class="acts"><button class="btn primary" data-a="obsave"'+dis()+'>Save checklist</button></div>';}
function grabOb(){var o=S.draft.ob;if(!o)return;[].forEach.call(document.querySelectorAll('[data-ob]'),function(e){var g=e.getAttribute('data-ob'),l=g==='s'?o.signoff:o.plan[+g].items;l[+e.getAttribute('data-i')][1]=e.value;});[].forEach.call(document.querySelectorAll('[data-obf]'),function(e){o.plan[+e.getAttribute('data-g')][e.getAttribute('data-obf')]=e.value;});}
/* ---- Commissions ---- */
function commTab(){var l=S.draft.comm||(S.draft.comm=clone(S.d.comm));return '<form class="list" id="cf"><p class="note small">Each rep needs a Google Sheet in the same format as the current commission sheets, shared with the account that owns the Hub. They set their own password the first time they open it.</p>'+l.map(function(c,i){return '<div class="card">'+fld('Rep name','c_n'+i,c.name)+fld('Google Sheet link','c_f'+i,c.file,'text','placeholder="Paste the sheet link"')+'<button type="button" class="link" data-a="cdel" data-i="'+i+'" style="justify-self:start">Remove this tracker</button></div>';}).join('')+'<button type="button" class="btn soft" data-a="cadd">Add a rep</button><button class="btn primary"'+dis()+'>Save commissions</button></form>';}
function grabComm(){(S.draft.comm||[]).forEach(function(c,i){var n=document.getElementById('c_n'+i),f=document.getElementById('c_f'+i);if(n)c.name=n.value;if(f)c.file=f.value;});}
/* ---- Map ---- */
function mapTab(){var m=S.d.map;return '<form class="card" id="mf"><h2>Measure tool map</h2><label class="fld">Imagery<select id="m_p"><option value="google"'+(m.provider==='google'?' selected':'')+'>Google (sharper)</option><option value="esri"'+(m.provider==='esri'?' selected':'')+'>Esri (no Google charges)</option></select></label>'+fld('Google map squares per device per day (0 = no limit)','m_d',m.dailyTiles,'number','inputmode="numeric"')+'<p class="warn small">This limit counts on each phone or computer, not across the company. Past it, that device switches to Esri for the rest of the day. It can\'t cap your Google bill, because the map talks to Google directly. Use a Google Cloud budget alert for that.</p><button class="btn primary"'+dis()+'>Save map</button></form>';}
/* ---- PINs ---- */
function pinsTab(){var box=function(w,t,sub,cur,nw){return '<form class="card" data-f="pin" data-w="'+w+'"><h2>'+t+'</h2><p class="muted small">'+sub+'</p>'+fld(cur,'pc_'+w,'','password','autocomplete="off"')+fld(nw,'pn_'+w,'','password','autocomplete="new-password"')+fld('Type it again','pa_'+w,'','password','autocomplete="new-password"')+'<button class="btn primary"'+dis()+'>Change</button></form>';};return '<div class="list">'+box('management','Management PIN','Opens the Management section. Tell your managers when it changes.','Current PIN','New PIN (4 to 8 digits)')+box('pricing','Pricing PIN','Unlocks editing in the Pricing Guide.','Current PIN','New PIN (4 to 8 digits)')+box('master','Master password','Owner only. It also opens every commission tracker.',S.d.hasMaster?'Current master password':'No master password yet. Leave this blank.','New master password (6 or more characters)')+'</div>';}
/* ---- Log ---- */
function logTab(){var l=S.d.log||[];return l.length?'<div class="card">'+l.map(function(x){return '<div class="log"><b>'+esc(x.what)+'</b><br><span class="muted">'+esc(x.when?new Date(x.when).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'')+' · '+esc(x.who)+'</span>'+(x.to?'<br><span class="small">'+esc(x.to)+'</span>':'')+'</div>';}).join('')+'</div>':'<p class="muted">No changes yet.</p>';}
function tabBody(){return {people:peopleTab,tiles:tilesTab,emails:emailsTab,branches:branchesTab,rules:rulesTab,docs:docsTab,onboarding:obTab,comm:commTab,map:mapTab,pins:pinsTab,log:logTab}[S.tab]();}
function render(){var h=head();
  if(!S.pin)h+='<div class="lock"><h2>Managers only</h2><p class="muted">Open this from the Management section.</p>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<a class="btn primary" href="../index.html#mgmt">Go to Management</a></div>';
  else if(S.asking||!S.by)h+=whoForm();
  else if(!S.d)h+=S.busy?'<p class="muted">Opening…</p>':(S.err?'<p class="err">'+esc(S.err)+'</p><button class="btn soft" data-a="retry">Try again</button>':'');
  else{if(S.msg)h+='<p class="okmsg">'+esc(S.msg)+'</p>';if(S.err)h+='<p class="err">'+esc(S.err)+'</p>';h+='<div class="chips">'+TABS.map(function(t){return '<button class="chip" data-tab="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>'+tabBody()+'<p class="muted small">Changing settings as <b>'+esc(S.by)+'</b> · <button class="link" data-a="manager">Change</button></p>';}
  var y=window.scrollY;app.innerHTML=h;window.scrollTo(0,y);}
app.addEventListener('input',function(e){var t=e.target,k=t.getAttribute('data-t');if(k&&S.tileEdit&&S.draft.tiles)S.draft.tiles.tiles[S.tileEdit][k]=t.value;});
app.addEventListener('change',function(e){var t=e.target,d=S.draft.tiles,g=t.getAttribute('data-tg');if(d&&S.tileEdit){var x=d.tiles[S.tileEdit];if(g){x.groups=x.groups.filter(function(y){return y!==g;});if(t.checked)x.groups.push(g);}if(t.getAttribute('data-th'))x.hidden=t.checked;}});
app.addEventListener('submit',function(e){e.preventDefault();var f=e.target,fk=f.getAttribute('data-f');
  if(f.id==='lf'){var by=val('by').trim();if(!by){S.err='Pick your name.';render();return;}S.by=by;ls('to.by',by);S.err='';S.asking=false;if(S.d)render();else load();return;}
  if(f.id==='pf'){var x={orig:S.edit.orig,name:val('p_name'),role:val('p_role'),section:val('p_sec'),branch:val('p_br'),phone:val('p_ph'),email:val('p_em'),start:val('p_st'),notes:val('p_no'),manager:document.getElementById('p_mg').checked,status:document.getElementById('p_ac').checked?'':'Inactive'};S.edit=Object.assign({},S.edit,x);S.busy=true;S.err='';S.msg='';render();api('adminPerson',[S.pin,S.by,x]).then(function(d){done(d,'Employee saved.');}).catch(fail);return;}
  if(f.id==='ef'){var v={};['timeOff','fieldRoutes','strikes','reviews'].forEach(function(k){v[k]=val('e_'+k);});v.licenseEmail=val('e_lic');v.alerts={};Object.keys(S.d.branches).forEach(function(k){v.alerts[k]=val('e_b_'+k);});save('emails',v,'Emails saved.');return;}
  if(f.id==='rf'){grabRules();save('rules',S.draft.rules,'Rules saved. Update the written policy if it changed.');return;}
  if(f.id==='cf'){grabComm();save('comm',S.draft.comm,'Commissions saved.');return;}
  if(f.id==='mf'){save('map',{provider:val('m_p'),dailyTiles:val('m_d')},'Map saved.');return;}
  if(fk==='br'||fk==='bradd'){var code=fk==='br'?f.getAttribute('data-c'):val('b_code'),nm=fk==='br'?val('b_'+code):val('b_new');S.busy=true;S.err='';S.msg='';render();api('adminBranch',[S.pin,S.by,{code:code,name:nm}]).then(function(d){done(d,fk==='br'?'Branch renamed.':'Branch added.');}).catch(fail);return;}
  if(fk==='pin'){var w=f.getAttribute('data-w'),cur=val('pc_'+w),nw=val('pn_'+w),ag=val('pa_'+w);if(nw!==ag){S.err='Those don\'t match.';render();return;}S.busy=true;S.err='';S.msg='';render();api('adminSetPin',[S.pin,S.by,w,cur,nw]).then(function(){if(w==='management'){S.pin=nw;try{sessionStorage.setItem('mgmt.pin',nw);}catch(x){}}S.busy=false;S.msg='Changed.';if(w==='master')S.d.hasMaster=true;render();window.scrollTo(0,0);}).catch(fail);return;}});
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var a=t.getAttribute('data-a');
  if(t.dataset.tab){if(S.tab==='rules')grabRules();if(S.tab==='comm')grabComm();if(S.tab==='onboarding')grabOb();S.tab=t.dataset.tab;S.msg='';S.err='';S.edit=null;render();window.scrollTo(0,0);return;}
  if(a==='retry')load();if(a==='manager'){S.asking=true;S.err='';loadNames();render();}if(a==='managerno'){S.asking=false;S.err='';render();}
  if(a==='padd'){S.edit={orig:'',name:'',role:'',section:'',branch:'',phone:'',email:'',start:'',notes:'',manager:false,status:''};S.msg='';render();window.scrollTo(0,0);}
  if(a==='pedit'){var p=S.d.people.filter(function(y){return y.name===t.dataset.n;})[0];S.edit=Object.assign({orig:p.name},p);S.msg='';render();window.scrollTo(0,0);}
  if(a==='pcancel'){S.edit=null;S.err='';render();}
  if(a==='tg'){S.tileG=t.dataset.g;S.tileEdit='';render();}if(a==='ted'){S.tileEdit=S.tileEdit===t.dataset.h?'':t.dataset.h;render();}
  if(a==='tup'||a==='tdn'){var d=tDraft(),l=d.order[S.tileG],vis=l.filter(function(x){return d.tiles[x].groups.indexOf(S.tileG)>=0&&!d.tiles[x].hidden;}),i=vis.indexOf(t.dataset.h),j=i+(a==='tup'?-1:1);if(j>=0&&j<vis.length){var A=l.indexOf(vis[i]),B=l.indexOf(vis[j]);l[A]=vis[j];l[B]=vis[i];render();}}
  if(a==='tsave'){var dd=tDraft(),o={};Object.keys(dd.tiles).forEach(function(h){var b=S.T.base[h],x=dd.tiles[h];if(x.name!==b.name||x.sub!==b.sub||x.hidden||x.groups.join()!==b.groups.join())o[h]=x;});save('tiles',{tiles:o,order:dd.order},'Tiles saved.');}
  if(a==='xadd'){grabRules();S.draft.rules.exceptions.push('');render();}if(a==='xdel'){grabRules();S.draft.rules.exceptions.splice(+t.dataset.i,1);render();}
  if(a==='dsave'){var g=grabDocs();S.draft.docs=g;save('docs',g,'Documents saved.');}
  if(a==='obadd'||a==='obdel'||a==='obgadd'||a==='obgdel'){grabOb();var ob=S.draft.ob,gi=t.dataset.g,li=gi==='s'?ob.signoff:gi!==undefined?ob.plan[+gi]&&ob.plan[+gi].items:null;if(a==='obadd')li.push(['','']);if(a==='obdel')li.splice(+t.dataset.i,1);if(a==='obgadd')ob.plan.push({phase:'',group:'',who:'supervisor',items:[['','']]});if(a==='obgdel')ob.plan.splice(+gi,1);render();}
  if(a==='obsave'){grabOb();save('onboarding',S.draft.ob,'Checklist saved.');}
  if(a==='cadd'){grabComm();S.draft.comm.push({key:'',name:'',file:''});render();}if(a==='cdel'){grabComm();S.draft.comm.splice(+t.dataset.i,1);render();}});
if(S.pin&&S.by)load();else{if(S.pin)loadNames();render();}
})();
</script>
</body>
