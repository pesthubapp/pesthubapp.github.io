 var items=[
  {id:'e1',name:'Cage trap, medium',total:14,out:[{id:'h1',tech:T[0],qty:3,since:now-2*DAY,note:'418 Sample Ln, skunk'},{id:'h2',tech:T[2],qty:2,since:now-9*DAY,note:'77 Birch Ct, raccoon'}]},

  {id:'e6',name:'Drill and rod termite kit',total:2,out:[]},{id:'e7',name:'Backpack mister',total:5,out:[]}];
 var active=[
  {id:'T1',branch:'North Branch',tech:T[0],itemId:'e1',item:'Cage trap, medium',qty:3,address:'418 Sample Ln',lat:null,lng:null,target:'Skunk',job:'20418',notes:'Under back deck, left side',setAt:now-50*HR,every:24,lastCheck:now-27*HR,nextDue:now-3*HR,status:'Active',catches:1},
  {id:'T2',branch:'South Branch',tech:T[2],itemId:'e1',item:'Cage trap, medium',qty:2,address:'77 Birch Ct',lat:null,lng:null,target:'Raccoon',job:'20377',notes:'Attic access by garage',setAt:now-30*HR,every:24,lastCheck:now-21*HR,nextDue:now+3*HR,status:'Active',catches:0},

 var log=[{when:now-6*HR,tech:T[1],action:'Caught',animal:'Squirrel',count:2,address:'1203 Orchard Rd',notes:'Relocated per state rules'},{when:now-21*HR,tech:T[2],action:'Empty',address:'77 Birch Ct',notes:''},{when:now-27*HR,tech:T[0],action:'Caught',animal:'Skunk',count:1,address:'418 Sample Ln',notes:'Trap reset'}];
 var prices=[

 ].map(function(r){ return {section:r[0],service:r[1],note:r[2],standard:r[3],floor:r[4]}; });
 var lic=[
  ['L1',T[0],'North Branch','TX','TX-448201',38],['L2',T[0],'North Branch','OK','OK-90217',410],['L3',T[1],'North Branch','TX','TX-512877',12],

 ].map(function(r){ return {id:r[0],tech:r[1],branch:r[2],state:r[3],type:'Commercial Applicator',number:r[4],expires:dateIn(r[5]),email:'',notes:''}; });
 var people=[
  ['Avery Lindqvist','Owner','All branches','Leadership','(555) 555-0100','avery@samplepest.example'],['Rosa Delgado','Operations Manager','All branches','Leadership','(555) 555-0101','rosa@samplepest.example'],

  [T[3],'Service Technician','South Branch','Service Technicians','(555) 555-0113',''],[T[4],'Wildlife Technician','East Branch','Service Technicians','(555) 555-0114',''],[T[5],'Service Technician','East Branch','Service Technicians','(555) 555-0115',''],

 ].map(function(p){ return {name:p[0],role:p[1],branch:p[2],section:p[3],phone:p[4],email:p[5],notes:''}; });
 return {T:T,stock:{IF:stock(1),WY:stock(.7),BZ:stock(.5)},shopLog:[{when:now-5*HR,who:T[0],action:'Checked out',product:'Bifen I/T',qty:1,unit:'gal'},{when:now-28*HR,who:T[1],action:'Checked out',product:'Snap traps',qty:12,unit:'each'},{when:now-52*HR,who:T[3],action:'Returned',product:'Delta Dust',qty:1,unit:'lb'}],
  items:items,eqLog:[{when:now-2*DAY,who:T[0],action:'Checked out',qty:3,item:'Cage trap, medium',note:'418 Sample Ln'}],active:active,trapLog:log,prices:prices,updated:new Date().toLocaleDateString(),lic:lic,licEmail:'manager@samplepest.example',licDays:'60,30,14,7,0',people:people,email:'manager@samplepest.example'};
}
function db(){ if(mem) return mem; try{ var r=ls(KEY); if(r) mem=JSON.parse(r); }catch(e){} if(!mem){ mem=seed(); save(); } return mem; }
function save(){ ls(KEY,JSON.stringify(mem)); }
function pin(p){ if(String(p)!==PIN) throw new Error('Wrong PIN. The demo PIN is 1234.'); }
function eq(){ var d=db(); return {items:d.items,techs:d.T}; }
function eqA(){ var d=db(); return {items:d.items,techs:d.T,log:d.eqLog.slice(0,40)}; }
function find(a,id){ return a.filter(function(x){return x.id===id;})[0]; }
function trapL(){ var d=db(); return {active:d.active,items:d.items,techs:d.T,log:d.trapLog}; }
function licD(){ var d=db(); return {rows:d.lic.map(function(r){ var x=Object.assign({},r), p=r.expires.split('-'), e=new Date(+p[0],p[1]-1,+p[2]), n=new Date(); n.setHours(0,0,0,0); x.days=Math.round((e-n)/DAY); return x; }),techs:d.T.map(function(t){ var p=d.people.filter(function(q){return q.name===t;})[0]; return {name:t,branch:p?p.branch:''}; }),email:d.licEmail,days:d.licDays,sheetUrl:''}; }
function pric(){ var d=db(); return {rows:d.prices,updated:d.updated,footer:'Sample prices for this demo. Each company enters its own.'}; }
function shop(br){ var d=db(); return {products:d.stock[br]||[],techs:d.T,log:d.shopLog.slice(0,60),email:d.email,sheetUrl:''}; }
var F={
 getDirectory:function(){ return {people:db().people,sheetUrl:''}; },
 eqList:eq,
 eqOut:function(tech,item,qty,note,when,key){ var d=db(), it=find(d.items,item); it.out.push({id:'h'+key,tech:tech,qty:+qty,since:when,note:note}); d.eqLog.unshift({when:when,who:tech,action:'Checked out',qty:qty,item:it.name,note:note}); save(); return true; },
 eqIn:function(hold,qty,note,when){ var d=db(); d.items.forEach(function(it){ it.out=it.out.filter(function(o){ if(o.id!==hold) return true; o.qty-=+qty; d.eqLog.unshift({when:when,who:o.tech,action:'Returned',qty:qty,item:it.name,note:note}); return o.qty>0; }); }); save(); return true; },
 eqAdmin:function(p,action,x){ pin(p); var d=db();
  if(action==='add') d.items.push({id:'e'+Date.now().toString(36),name:x.name,total:Math.max(0,+x.total||0),out:[]});
  if(action==='update'){ var it=find(d.items,x.id); if(x.name) it.name=x.name; if(x.total!==undefined) it.total=x.total; }
  if(action==='delete') d.items=d.items.filter(function(i){return i.id!==x.id;});
  save(); return eqA(); },

  if(need>0) it.out.push({id:'h'+key,tech:tech,qty:need,since:when,note:address});
  d.active.push({id:'T'+key.slice(-10),branch:branch,tech:tech,itemId:itemId,item:it.name,qty:+qty,address:address||'Address not entered',lat:lat,lng:lng,target:target,job:job,notes:notes,setAt:when,every:+every,lastCheck:null,nextDue:when+every*HR,status:'Active',catches:0});
  d.trapLog.unshift({when:when,tech:tech,action:'Set',address:address,notes:notes}); save(); return true; },
 trapCheck:function(id,tech,result,animal,count,keep,notes,when){ var d=db(), t=find(d.active,id); if(!t) return true;
  if(result==='Pulled'||(result==='Caught'&&!keep)) d.active=d.active.filter(function(x){return x!==t;});
  else { t.lastCheck=when; t.nextDue=when+t.every*HR; if(result==='Caught') t.catches+=(+count||1); }
  d.trapLog.unshift({when:when,tech:tech,action:result,animal:animal,count:count,address:t.address,notes:notes}); save(); return true; },
 getPricing:pric,
 pricingUnlock:function(p){ pin(p); return {sheetUrl:''}; },
 pricingSave:function(p,rows){ pin(p); var d=db(); d.prices=rows; d.updated=new Date().toLocaleDateString(); save(); return pric(); },
 licUnlock:function(){ return licD(); },
 licSave:function(p,r){ var d=db(); if(r.id){ d.lic=d.lic.map(function(x){ return x.id===r.id?Object.assign({},x,r):x; }); } else { r.id='L'+Date.now().toString(36); d.lic.push(r); } save(); return licD(); },
 licDelete:function(p,id){ var d=db(); d.lic=d.lic.filter(function(x){return x.id!==id;}); save(); return licD(); },
 licSettings:function(p,email,days){ var d=db(); d.licEmail=email; d.licDays=days; save(); return licD(); },
 licTest:function(p){ return {sent:0,note:'Demo only: no email was sent. The live version emails this reminder.'}; },
 getKiosk:function(br){ return shop(br); },
 checkout:function(br,tech,items,when){ var d=db(); items.forEach(function(i){ var p=find(d.stock[br],i.id); if(p){ p.qty=Math.max(0,p.qty-i.qty); d.shopLog.unshift({when:when,who:tech,action:'Checked out',product:p.name,qty:i.qty,unit:p.unit}); } }); save(); return true; },
 returnItems:function(br,tech,items,when){ var d=db(); items.forEach(function(i){ var p=find(d.stock[br],i.id); if(p){ p.qty+=i.qty; d.shopLog.unshift({when:when,who:tech,action:'Returned',product:p.name,qty:i.qty,unit:p.unit}); } }); save(); return true; },
 adminState:function(br,p){ pin(p); return shop(br); },
 adminSaveProduct:function(br,p,x){ pin(p); var d=db(), a=d.stock[br], o=x.id?find(a,x.id):null; if(o) Object.assign(o,x,{qty:+x.qty,reorderAt:+x.reorderAt}); else a.push(Object.assign({},x,{id:'p'+Date.now().toString(36),qty:+x.qty||0,reorderAt:+x.reorderAt||0})); save(); return shop(br); },
 adminRestock:function(br,p,id,add){ pin(p); var d=db(), o=find(d.stock[br],id); o.qty+=(+add||0); d.shopLog.unshift({when:Date.now(),who:'Manager',action:'Restocked',product:o.name,qty:+add||0,unit:o.unit}); save(); return shop(br); },
 adminDeleteProduct:function(br,p,id){ pin(p); var d=db(); d.stock[br]=d.stock[br].filter(function(x){return x.id!==id;}); save(); return shop(br); },
 adminAddTech:function(br,p,n){ pin(p); var d=db(); if(d.T.indexOf(n)<0) d.T.push(n); save(); return shop(br); },
 adminRemoveTech:function(br,p,n){ pin(p); var d=db(); d.T=d.T.filter(function(x){return x!==n;}); save(); return shop(br); },
 adminSettings:function(br,p,em){ pin(p); var d=db(); if(em!=null) d.email=em; save(); return shop(br); }
};
window.fetch=function(u,o){ var url=String(u&&u.url||u);
 if(url==='demo-api'){ var b=JSON.parse(o.body), r;
  try{ if(!F[b.fn]) throw new Error('Not in this demo.'); r={ok:true,data:JSON.parse(JSON.stringify(F[b.fn].apply(null,b.args||[])))}; }catch(e){ r={ok:false,error:e.message}; }
  return new Promise(function(res){ setTimeout(function(){ res(new Response(JSON.stringify(r),{status:200,headers:{'Content-Type':'application/json'}})); },90); }); }
 if(/nominatim/.test(url)){ var S=[{lat:'39.00000',lon:'-95.00000',address:{house_number:'418',road:'Sample Ln',city:'Sampleton',postcode:'00000'},display_name:'418 Sample Ln, Sampleton'}];
  return Promise.resolve(new Response(JSON.stringify(/reverse/.test(url)?S[0]:S),{status:200})); }
 return realFetch(u,o); };

<style>
:root{--bg:#f3f6f4;--surface:#fff;--sunk:#e6ecE8;--ink:#1f2324;--muted:#55635a;--line:#d5dfd8;--accent:#046725;--accent-ink:#ffffff;--accent-soft:#e4f1e8;--ok:#067a2e;

*{box-sizing:border-box}html,body{margin:0;min-height:100%}

.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font:700 1.25rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 0;color:var(--muted)}
.list{display:grid;gap:10px}
.p{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1.15rem var(--display);flex:none}
.who b{display:block;font-size:1.1rem;font-weight:600;line-height:1.2}
.who span{color:var(--muted);font-size:.92rem}
.notes{margin:0;color:var(--muted);font-size:.92rem;white-space:pre-line}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:10px;font-weight:600;text-decoration:none;background:var(--sunk);border:1px solid var(--line);color:var(--ink);font-size:.95rem}
.act.call{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.act svg{width:18px;height:18px}
.sub{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
</style>
</head>

var app=document.getElementById('app');
var S={people:[],loaded:false,err:'',q:'',sec:'All',sheetUrl:''};
var ORDER=['Leadership','Service Technicians','Office','Outbound Sales'];
var I={phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function tel(p){ var t=String(p||'').trim(); if(!t) return ''; if(/^\+/.test(t)) return '+'+t.replace(/\D/g,'');
  var d=t.replace(/\D/g,''); if(/^011/.test(d)) return '+'+d.slice(3); if(d.length===11&&d[0]==='1') return '+'+d; if(d.length===10) return '+1'+d; return d; }
function showPhone(p){ var t=tel(p); if(/^\+1\d{10}$/.test(t)) return '('+t.slice(2,5)+') '+t.slice(5,8)+'-'+t.slice(8); if(/^\+52/.test(t)) return '+52 '+t.slice(3,6)+' '+t.slice(6,9)+' '+t.slice(9)+' (Mexico)'; return p; }
function initials(n){ return n.split(/\s+/).map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase(); }
function render(){
  var q=S.q.toLowerCase().trim();
  var secs=ORDER.concat(S.people.map(function(p){return p.section||'Other';}).filter(function(s,i,a){ return ORDER.indexOf(s)<0&&a.indexOf(s)===i; }));
  secs=secs.filter(function(s){ return S.people.some(function(p){ return (p.section||'Other')===s; }); });
  var list=S.people.filter(function(p){ return (S.sec==='All'||(p.section||'Other')===S.sec)&&(!q||[p.name,p.role,p.branch,p.notes,p.phone,p.email,p.section].join(' ').toLowerCase().indexOf(q)>=0); });
  var body=!S.loaded?'<div class="empty">'+(S.err?esc(S.err):'Loading directory…')+'</div>':!list.length?'<div class="empty">No one matches.</div>':
    secs.map(function(s){ var ps=list.filter(function(p){ return (p.section||'Other')===s; }); if(!ps.length) return '';
      return '<h2>'+esc(s)+'</h2><div class="list">'+ps.map(card).join('')+'</div>'; }).join('');
  app.innerHTML='<a class="back" href="../index.html">← All tools</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Directory</b><span class="eyebrow">Team contacts</span></div></div>'+
    '<input type="search" id="q" placeholder="Search name, role or branch" value="'+esc(S.q)+'">'+
    (S.loaded?'<div class="chips">'+['All'].concat(secs).map(function(s){ return '<button class="chip" data-s="'+esc(s)+'" aria-pressed="'+(S.sec===s)+'">'+esc(s)+'</button>'; }).join('')+'</div>':'')+

}
function card(p){ var t=tel(p.phone);
  return '<div class="p"><div class="top"><div class="av">'+esc(initials(p.name))+'</div><div class="who"><b>'+esc(p.name)+'</b><span>'+esc([p.role,p.branch].filter(Boolean).join(' · '))+'</span></div></div>'+
    (p.notes?'<p class="notes">'+esc(p.notes)+'</p>':'')+
    ((t||p.email)?'<div class="acts">'+(t?'<a class="act call" href="tel:'+t+'">'+I.phone+'Call</a><a class="act" href="sms:'+t+'">'+I.text+'Text</a>':'')+(p.email?'<a class="act" href="mailto:'+esc(p.email)+'">'+I.mail+'Email</a>':'')+'</div>':'')+

app.addEventListener('click',function(e){ var b=e.target.closest('[data-s]'); if(!b) return; S.sec=b.getAttribute('data-s'); render(); });
