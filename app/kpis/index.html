<script>
var MARK='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsPSJQZXN0SHViIj48ZyBzdHJva2U9IiMwNDY3MjUiIHN0cm9rZS13aWR0aD0iMy42IiBzdHJva2UtbGluZWNhcD0icm91bmQiIGZpbGw9Im5vbmUiPjxwYXRoIGQ9Ik0yNiAyNyAxMSAxNk0yNCAzNkg2TTI2IDQ1IDExIDU2TTM4IDI3IDUzIDE2TTQwIDM2SDU4TTM4IDQ1IDUzIDU2Ii8+PC9nPjxnIGZpbGw9IiMwNDY3MjUiPjxjaXJjbGUgY3g9IjExIiBjeT0iMTYiIHI9IjUiLz48Y2lyY2xlIGN4PSI2IiBjeT0iMzYiIHI9IjUiLz48Y2lyY2xlIGN4PSIxMSIgY3k9IjU2IiByPSI1Ii8+PGNpcmNsZSBjeD0iNTMiIGN5PSIxNiIgcj0iNSIvPjxjaXJjbGUgY3g9IjU4IiBjeT0iMzYiIHI9IjUiLz48Y2lyY2xlIGN4PSI1MyIgY3k9IjU2IiByPSI1Ii8+PC9nPjxjaXJjbGUgY3g9IjMyIiBjeT0iMTQiIHI9IjciIGZpbGw9IiMxZjIzMjQiLz48ZWxsaXBzZSBjeD0iMzIiIGN5PSIzNiIgcng9IjExIiByeT0iMTUiIGZpbGw9IiMxZjIzMjQiLz48cGF0aCBkPSJNMzIgMjJWNTEiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIyLjQiLz48L3N2Zz4=';
(function(){
var API_URL='demo-api';
var app=document.getElementById('app'), S={pin:'',data:null,wk:'',err:'',busy:false};
try{ S.pin=localStorage.getItem('kpi.pin')||''; var c=JSON.parse(localStorage.getItem('kpi.data')||'null'); if(c&&S.pin) S.data=c; }catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function isMoney(g,s){return /revenue/i.test(g.name)||/revenue/i.test(s.label);}
function lowGood(s,g){return /cancel|reservice|reschedule|standing/i.test(s.label+' '+g.name);}
function nm(t){return String(t).replace(/^Oustanding/i,'Outstanding');}
function fmt(n,money,unit){if(n==null)return '—';if(money)return '$'+Math.round(n).toLocaleString();if(unit==='%')return (Math.round(n*10)/10)+'%';if(unit==='time')return (Math.round(n*10)/10)+' min';return (Math.round(n*10)/10).toLocaleString();}
function prevVal(s,k){var ks=Object.keys(s.pts).filter(function(x){return x<k;}).sort();return ks.length?s.pts[ks[ks.length-1]]:null;}
function chg(now,prev,money,unit,low){if(now==null||prev==null)return '';var d=now-prev;if(Math.abs(d)<1e-9)return '<span class="chg">Same as last week</span>';
  var good=low?d<0:d>0, txt=(d>0?'▲ ':'▼ ')+(unit==='%'?(Math.round(Math.abs(d)*10)/10)+' pts':money?'$'+Math.round(Math.abs(d)).toLocaleString():(prev?Math.round(Math.abs(d)/Math.abs(prev)*100)+'%':Math.round(Math.abs(d)*10)/10));
  return '<span class="chg '+(good?'good':'bad')+'">'+txt+' vs last week</span>';}
function load(){S.busy=true;S.err='';render();api('kpiData',[S.pin]).then(function(d){S.data=d;S.busy=false;try{localStorage.setItem('kpi.pin',S.pin);localStorage.setItem('kpi.data',JSON.stringify(d));}catch(e){}render();})
  .catch(function(e){S.busy=false;S.err=String(e.message||e);if(/pin/i.test(S.err)){S.data=null;try{localStorage.removeItem('kpi.pin');localStorage.removeItem('kpi.data');}catch(x){}}render();});}
function pickWeek(){var w=S.data.weeks,today=new Date(),best='';w.forEach(function(k){if(dt(k)<=new Date(today.getTime()+864e5))best=k;});return best||w[w.length-1];}
function lockView(){return '<form class="lock" id="f"><h2>Managers only</h2><p class="muted">Enter the manager PIN to see company numbers.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Demo PIN: 1234"><button class="btn" '+(S.busy?'disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button>'+(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'</form>';}
function weekView(){var d=S.data,k=S.wk,ws=d.weeks,i=ws.indexOf(k),h='';
  h+='<div class="weekbar"><button id="prev" aria-label="Previous week" '+(i<=0?'disabled':'')+'>‹</button><select id="wk" aria-label="Week">'+ws.slice().reverse().map(function(x){return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+wkLabel(x)+'</option>';}).join('')+'</select><button id="next" aria-label="Next week" '+(i>=ws.length-1?'disabled':'')+'>›</button></div>';
  var stats='', cards='';
  d.groups.forEach(function(g){
    var veh=/vehicle/i.test(g.name);
    var items=g.series.map(function(s){return {s:s,v:s.pts[k]!=null?s.pts[k]:null,p:prevVal(s,k),money:isMoney(g,s),low:lowGood(s,g)};});
    if(veh){var tot=0,ptot=0,has=false,phas=false;items.forEach(function(x){if(x.v!=null){tot+=x.v;has=true;}if(x.p!=null){ptot+=x.p;phas=true;}});
      var prevK=ws[i-1];ptot=0;phas=false;if(prevK)items.forEach(function(x){if(x.s.pts[prevK]!=null){ptot+=x.s.pts[prevK];phas=true;}});
      stats='<div class="stat big"><span class="k">Vehicle revenue this week</span><span class="v">'+(has?fmt(tot,true):'—')+'</span>'+(has&&phas?chg(tot,ptot,true,'',false):'')+'</div>'+stats;
      var live=items.filter(function(x){return x.v!=null;}).sort(function(a,b){return b.v-a.v;}),mx=Math.max.apply(null,live.map(function(x){return x.v;}).concat([1]));
      cards+='<section class="card"><h2>Revenue by vehicle</h2>'+(live.length?'<div class="bars">'+live.map(function(x){return '<div class="bar"><span class="n">'+esc(x.s.label)+'</span><span class="a">'+fmt(x.v,true)+'</span><span class="t"><i style="width:'+Math.max(2,x.v/mx*100)+'%"></i></span>'+(x.p!=null?'<span class="c">'+chg(x.v,x.p,true,'',false).replace(/<\/?span[^>]*>/g,'')+'</span>':'')+'</div>';}).join('')+'</div>':'<p class="muted">No vehicle numbers for this week.</p>')+'</section>';
      return;}
    var tech=g.series.some(function(s){return s.unit;});
    if(!tech){items.forEach(function(x){if(x.v==null)return;stats+='<div class="stat"><span class="k">'+esc(nm(x.s.label))+'</span><span class="v">'+fmt(x.v,x.money,x.s.unit)+'</span>'+chg(x.v,x.p,x.money,x.s.unit,x.low)+'</div>';});return;}
    var live2=g.series.map(function(s){var ks=Object.keys(s.pts).filter(function(x){return x<=k;}).sort();if(!ks.length)return null;var lk=ks[ks.length-1];
      return {s:s,k:lk,v:s.pts[lk],p:ks.length>1?s.pts[ks[ks.length-2]]:null};}).filter(Boolean);
    var old=live2.some(function(x){return x.k!==k;});
    cards+='<section class="card"><h2>'+esc(g.name)+(g.series.some(function(s){return s.unit==='time';})?' (minutes per job)':'')+'</h2>'+(old?'<p class="muted">Not every tech has a number for this week, so each shows their latest week.</p>':'')+(live2.length?'<div class="rows">'+live2.map(function(x){return '<div class="row"><span>'+esc(x.s.label)+(x.k!==k?'<span class="when">Week of '+wkLabel(x.k)+'</span>':'')+'</span><span class="a'+(x.s.unit==='time'&&x.v<=14?' low':'')+'">'+fmt(x.v,false,x.s.unit)+(x.s.unit==='time'&&x.v<=14?'<span class="flag">Too short (14 min or less)</span>':'')+(x.s.unit==='time'?chg(x.v,x.p,false,'',false).replace(/chg (good|bad)/,'chg'):chg(x.v,x.p,false,x.s.unit,lowGood(x.s,g))).replace('vs last week','vs week before')+'</span></div>';}).join('')+'</div>':'<p class="muted">No numbers yet.</p>')+'</section>';
  });
  h+='<div class="stats">'+stats+'</div>'+cards;
  if(d.years&&d.years.rows.length){var cm=MON[dt(k).getMonth()];
    h+='<section class="card"><h2>Monthly revenue: '+esc(d.years.b)+' vs '+esc(d.years.a)+'</h2><table><thead><tr><th>Month</th><th>'+esc(d.years.a)+'</th><th>'+esc(d.years.b)+'</th><th>Change</th></tr></thead><tbody>'+
    d.years.rows.map(function(r){var p=(r.a&&r.b!=null)?Math.round((r.b-r.a)/r.a*100):null;return '<tr'+(r.month.slice(0,3)===cm?' class="now"':'')+'><td>'+esc(r.month)+'</td><td>'+fmt(r.a,true)+'</td><td>'+fmt(r.b,true)+'</td><td>'+(p==null?'—':(p>0?'+':'')+p+'%')+'</td></tr>';}).join('')+'</tbody></table></section>';}
  var up=new Date(d.updated);h+='<div class="foot"><span>Updated '+up.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'. Refreshes daily at 6am.</span><button id="lockbtn">Lock</button></div>';
  return h;}
function render(){var h='<a class="back" href="../index.html">← All tools</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b style="text-transform:none">KPIs</b><span class="eyebrow">Weekly company numbers</span></div></div>';
  if(!S.data) h+=lockView(); else { if(!S.wk||S.data.weeks.indexOf(S.wk)<0) S.wk=pickWeek(); h+=weekView(); }
  app.innerHTML=h; var p=document.getElementById('pin'); if(p) p.focus();}
app.addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('pin');S.pin=(p&&p.value||'').trim();if(S.pin)load();});

app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var ws=S.data&&S.data.weeks,i=ws?ws.indexOf(S.wk):-1;
  if(t.id==='prev'&&i>0){S.wk=ws[i-1];render();} if(t.id==='next'&&i<ws.length-1){S.wk=ws[i+1];render();}
