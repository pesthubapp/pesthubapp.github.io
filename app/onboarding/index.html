<style>
:root{--bg:#f3f6f4;--surface:#fff;--sunk:#e6ecE8;--ink:#1f2324;--muted:#55635a;--line:#d5dfd8;--accent:#046725;--accent-ink:#ffffff;--accent-soft:#e4f1e8;--ok:#067a2e;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--ok:#9fd65a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
input[type=search]{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h1{font:700 2rem/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:700 1.3rem/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:0}
h3{font:700 1.08rem/1.25 var(--body);margin:14px 0 4px}
a{color:var(--ok)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.err{color:#b3261e;font-weight:600;margin:0}
.ok{color:var(--ok);font-weight:600;margin:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.link{background:none;border:0;color:var(--ok);font-weight:600;cursor:pointer;padding:0}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;display:grid;gap:12px;max-width:440px}
.lock input{width:100%;min-height:52px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:600 1.2rem var(--body)}
input[type=search]{width:100%;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px}
.start{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.start h2 a{color:inherit;text-decoration:none}
.chap{margin:4px 0 0;padding-left:22px;columns:2 220px;column-gap:24px}
.chap li{margin:0 0 6px;break-inside:avoid}
.chap a{color:var(--ink);text-decoration:none;font-weight:500}
.lib{margin-top:6px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;text-decoration:none;color:var(--ink);min-height:84px;align-content:start}
.doc b{font-weight:700;line-height:1.25}
.doc span{font-size:.85rem;color:var(--muted)}
.hits{display:grid;gap:8px}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-decoration:none;color:var(--ink)}
.hit .where{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hit .snip{font-size:.95rem}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.tools{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tools select{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font:inherit;color:inherit}
.intro{display:grid;gap:4px}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px}
details.sec>summary{cursor:pointer;list-style:none;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;font:700 1.15rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-size:1.4rem;color:var(--muted);flex:none}
details.sec[open]>summary::after{content:"–"}
details.sec .body{padding:0 16px 16px}
ul,ol{margin:0 0 10px;padding-left:22px}
li{margin:0 0 6px}
.say{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0 0 10px;display:grid;gap:8px}
.say p{margin:0;font-style:italic}
.copy{justify-self:start;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;cursor:pointer;color:var(--ink)}
.note{border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 10px 10px 0;padding:10px 12px;margin:0 0 10px}

.note.warn b{color:#b3261e}
details.qa{border:1px solid var(--line);border-radius:12px;margin:0 0 8px;background:var(--bg)}
details.qa summary{cursor:pointer;padding:12px 14px;font-weight:600}
details.qa p{padding:0 14px 12px;margin:0}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:10px}

.steps li::before{content:counter(s);grid-row:span 2;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 1.2rem var(--display)}
.steps li span{color:var(--muted)}
.never{list-style:none;padding:0}
.never li{padding-left:26px;position:relative;color:#b3261e;font-weight:600}

.check{list-style:none;padding:0}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ok)}
.check input:checked+span{color:var(--muted);text-decoration:line-through}
.tw{overflow-x:auto;margin:0 0 12px;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:var(--ink);color:var(--bg);text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top;min-width:120px}
td:first-child{font-weight:600}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%,40%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:none}}
.pn{display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:.92rem}
.pn a{text-decoration:none;max-width:48%}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.imp .file{position:relative;overflow:hidden;justify-self:start}
.imp .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.soonc{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:16px;display:grid;gap:4px}
.soonc b{font:700 1.3rem/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.soonc span:last-child{color:var(--muted);font-size:.92rem}
.pill{justify-self:start;background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.doc .ok,.doc .need{font-size:.8rem;font-weight:600}
.doc .need{color:#b3261e}
.small{font-size:.85rem}
.pol{gap:4px}
.pol .ph{font:700 1.1rem/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 2px}
.pol .ph:first-child{margin-top:0}
.kv li b{display:block}
.signbox{gap:14px;border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--ok)}
.fld{display:grid;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
.fld input{min-height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:500 1.05rem var(--body);color:var(--ink)}
.pad{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;height:170px}

.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#8a8f86;font-weight:500;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);min-height:52px;font-size:1.05rem}
.done{border-color:var(--ok)}
.done .btn{justify-self:start}

select{font:inherit;color:var(--ink)}
.fld select{min-height:50px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:500 1.05rem var(--body)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.cnt{font-size:.85rem;color:var(--muted);margin:0}
.doc .ok{font-size:.85rem}
.meta{margin:-6px 0 0}
.items{display:grid;gap:2px}
.it{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--ok)}
.it>span{display:grid;gap:2px}
.it.on .tx{color:var(--muted)}
.it .by{font-size:.8rem;color:var(--ok);font-weight:600}
.tag{font-size:.78rem;font-weight:600}.tag.need{color:#b3261e}
.need{color:#b3261e;font-weight:600;margin:0}
.bonus{background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:8px 0 0;font-weight:500}
.phases{padding:6px 10px}.phases table{border-collapse:collapse;width:100%;font-size:.9rem}.phases th,.phases td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}.phases tr:last-child td{border-bottom:0}.phases th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.me input{min-height:46px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.signbox .fld input{width:100%}
.rmbox{border-style:dashed}
.rmrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.btn.danger{background:#b3261e;color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:#b3261e}
.fld input{width:100%}
.rmbox{border-style:dashed}
.rmrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.btn.danger{background:#b3261e;color:#fff}
.btn.ghost{background:none;border:1px solid var(--line);color:#b3261e}

(function(){
var API_URL='demo-api';
var BR={IF:'North Branch',WY:'South Branch',BZ:'East Branch'};
var POLS={t_hb:'Employee Handbook',t_drive:'Driving Policy',t_card:'Company Credit Card Policy'};
var app=document.getElementById('app'),S={data:null,loading:true,err:'',view:'',me:'',pol:{},busy:false,signErr:'',done:null,showDone:false,formErr:'',rm:false,rmErr:'',rmBusy:false};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
S.me=ls('ob.me')||ls('pol.name')||'';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.json();}).then(function(j){if(!j.ok)throw new Error(j.error||'Error');return j.data;});}
function nice(ymd){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd||'');return m?new Date(+m[1],m[2]-1,+m[3]).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):(ymd||'');}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function allKeys(){var k=[];if(!S.data)return k;S.data.plan.forEach(function(g){g.items.forEach(function(i){k.push(i[0]);});});S.data.signoff.forEach(function(i){k.push(i[0]);});return k;}
function prog(h){var k=allKeys(),n=k.filter(function(x){return h.checks[x];}).length;return {n:n,t:k.length};}
function hire(){if(!S.data)return null;return S.data.hires.filter(function(h){return h.id===S.view;})[0]||null;}
function head(sub){return '<a class="back" href="'+(S.view?'#':'../index.html')+'">'+(S.view?'← Onboarding':'← All tools')+'</a><div class="brand"><img src="'+MARK+'" alt=""><div class="txt"><b>Onboarding</b><span class="eyebrow">'+esc(sub||'New tech checklist')+'</span></div></div>';}
function bar(p){return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+p.t+'" aria-valuenow="'+p.n+'"><i style="width:'+Math.round(100*p.n/Math.max(1,p.t))+'%"></i></div>';}

function homeView(){var h=head();
  if(S.loading&&!S.data)return h+'<p class="muted">Loading…</p>';
  if(S.err&&!S.data)return h+'<p class="err">'+esc(S.err)+'</p><button class="btn" data-a="reload">Try again</button>';
  var open=S.data.hires.filter(function(x){return x.status!=='Signed off';}),done=S.data.hires.filter(function(x){return x.status==='Signed off';});
  h+='<p class="muted">A new tech is ready to work after 2 days. Every item must be checked off before the supervisor signs off and clears them to work alone.</p>';
  h+='<h2>In progress</h2>';
  h+=open.length?'<div class="docs">'+open.map(card).join('')+'</div>':'<p class="muted">No open checklists. Start one below when a tech is hired.</p>';
  h+='<section class="card"><h2>Start a new hire</h2>'+
    '<label class="fld">Tech name<input id="f_tech" autocomplete="off" placeholder="First and last name"></label>'+
    '<div class="row2"><label class="fld">Branch<select id="f_br"><option value="">Pick one</option><option value="IF">North Branch</option><option value="WY">South Branch</option><option value="BZ">East Branch</option></select></label>'+
    '<label class="fld">Start date (Day 1)<input id="f_start" type="date"></label></div>'+
    '<label class="fld">Supervisor<input id="f_sup" autocomplete="off" placeholder="Who runs Day 1 and Day 2"></label>'+
    (S.formErr?'<p class="err">'+esc(S.formErr)+'</p>':'')+
    '<button class="btn primary" data-a="start">Start checklist</button></section>';
  if(done.length){h+='<h2>Signed off</h2>';h+=S.showDone||done.length<=4?'<div class="docs">'+done.map(card).join('')+'</div>':'<button class="link" data-a="showdone">Show '+done.length+' signed-off techs</button>';}
  return h;}
function card(x){var p=prog(x),so=x.status==='Signed off';
  return '<a class="doc" href="#h'+esc(x.id)+'"><b>'+esc(x.tech)+'</b><span>'+esc(BR[x.branch]||x.branch)+(x.start?' · Starts '+esc(nice(x.start)):'')+'</span>'+
    (so?'<span class="ok">✓ Cleared to work alone '+esc(String(x.signed).split(' at ')[0])+'</span>':bar(p)+'<span class="cnt">'+p.n+' of '+p.t+' done</span>')+'</a>';}

function item(h,i,locked){var c=h.checks[i[0]],pol=POLS[i[0]],ps=pol&&S.pol[pol];
  return '<label class="it'+(c?' on':'')+'"><input type="checkbox" data-k="'+esc(i[0])+'"'+(c?' checked':'')+(locked?' disabled':'')+'><span><span class="tx">'+esc(i[1])+'</span>'+
    (ps?'<span class="tag ok">✓ Signed on the Policies page '+esc(ps)+'</span>':pol?'<span class="tag need">Not signed on the Policies page yet</span>':'')+
    (c?'<span class="by">'+esc(nice(c.at))+(c.by?' · '+esc(c.by):'')+'</span>':'')+'</span></label>';}
function hireView(){var h=hire();if(!h){return head()+'<p class="muted">'+(S.loading?'Loading…':'Checklist not found.')+'</p>';}
  var so=h.status==='Signed off',p=prog(h),out=head(BR[h.branch]||h.branch);
  out+='<h1>'+esc(h.tech)+'</h1><p class="muted meta">'+(h.start?'Day 1: '+esc(nice(h.start))+' · ':'')+(h.supervisor?'Supervisor: '+esc(h.supervisor):'No supervisor set yet')+'</p>';
  out+=bar(p)+'<p class="cnt">'+p.n+' of '+p.t+' done</p>';
  if(so)out+='<section class="card done"><h2>Cleared to work alone</h2><p>Signed off by '+esc(h.supervisor)+' on '+esc(h.signed)+'. The signed PDF is saved in the tech\'s employee folder.</p>'+(h.file?'<a href="'+esc(h.file)+'" target="_blank" rel="noopener">Open the PDF (office Google account)</a>':'')+'</section>';
  else out+='<label class="fld me">Your name (shows who checked each item)<input id="me" autocomplete="name" placeholder="First and last name" value="'+esc(S.me)+'"></label>';
  out+='<div class="card phases"><table><thead><tr><th>Phase</th><th>When</th><th>Who</th></tr></thead><tbody>'+
    '<tr><td>Before Day 1</td><td>After the offer</td><td>Owner, tech</td></tr><tr><td>Day 1</td><td>Morning review, afternoon ride-along</td><td>Supervisor, tech</td></tr>'+
    '<tr><td>Day 2</td><td>Half day ride-along, tech does all the work</td><td>Supervisor, tech</td></tr><tr><td>Sign-off</td><td>End of Day 2</td><td>Supervisor</td></tr></tbody></table></div>';
  var last='';
  S.data.plan.forEach(function(g){
    if(g.phase!==last){if(last)out+='</section>';out+='<section class="card"><h2>'+esc(g.phase)+'</h2>';
      if(g.phase==='Before Day 1')out+='<p class="muted">As soon as the tech is interviewed and hired, we sign them up for the state apprentice license test and send the state study guide and training manuals.</p>';
      last=g.phase;}
    out+='<h3>'+esc(g.group)+'</h3><div class="items">'+g.items.map(function(i){return item(h,i,so);}).join('')+'</div>';
    
  });
  out+='</section>';
  out+='<section class="card" id="so"><h2>Sign-off form</h2><p class="muted">The supervisor signs after Day 2. The tech is free to work only after every item below is initialed.</p><div class="items">'+S.data.signoff.map(function(i){return item(h,i,so);}).join('')+'</div></section>';
  if(!so){var left=p.t-p.n;
    out+='<section class="card signbox" id="sign"><h2>Supervisor sign-off</h2>'+
      (left?'<p class="need">'+left+' item'+(left>1?'s':'')+' still need'+(left>1?'':'s')+' to be checked off before you can sign.</p>':'<p class="ok">Every item is checked off.</p>')+
      '<p>By signing, the supervisor confirms the tech is ready to work on their own.</p>'+
      '<div class="row2"><label class="fld">Supervisor name<input id="s_name" autocomplete="off" value="'+esc(h.supervisor)+'"></label><label class="fld">Initials<input id="s_ini" maxlength="5" autocomplete="off" style="text-transform:uppercase"></label></div>'+
      '<div class="fld">Tech signature ('+esc(h.tech)+')<div class="pad"><canvas id="padT"></canvas><span class="hint" id="hintT">Tech signs here</span></div><button type="button" class="link" data-a="clear" data-p="T">Clear</button></div>'+
      '<div class="fld">Supervisor signature<div class="pad"><canvas id="padS"></canvas><span class="hint" id="hintS">Supervisor signs here</span></div><button type="button" class="link" data-a="clear" data-p="S">Clear</button></div>'+
      '<label class="fld">Management PIN<input id="s_pin" placeholder="Demo PIN: 1234" type="password" inputmode="numeric" autocomplete="off"></label>'+
      (S.signErr?'<p class="err">'+esc(S.signErr)+'</p>':'')+
      '<button class="btn primary" data-a="sign"'+(left||S.busy?' disabled':'')+'>'+(S.busy?'Saving…':'Sign off and clear to work alone')+'</button>'+
      '<p class="muted small">Today\'s date is added automatically. A signed PDF is saved to the tech\'s employee folder.</p></section>';
    out+='<section class="card rmbox"><h2>Remove this checklist</h2><p class="muted">Use this if the new hire doesn\'t finish onboarding. It comes off this page, and the office keeps a record in the Sheet.</p>'+
      (S.rm?'<label class="fld">Management PIN<input id="rm_pin" placeholder="Demo PIN: 1234" type="password" inputmode="numeric" autocomplete="off"></label>'+(S.rmErr?'<p class="err">'+esc(S.rmErr)+'</p>':'')+
        '<div class="rmrow"><button class="btn danger" data-a="rmgo"'+(S.rmBusy?' disabled':'')+'>'+(S.rmBusy?'Removing…':'Remove '+esc(h.tech))+'</button><button class="link" data-a="rmcancel">Cancel</button></div>'
      :'<button class="btn ghost" data-a="rm">Remove this checklist</button>')+'</section>';}
  return out;}

var pads={};
function setupPad(id){var c=document.getElementById('pad'+id);if(!c)return;var r=c.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  var x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';var P=pads[id]={c:c,x:x,ink:false,draw:false};
  function pt(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
  c.addEventListener('pointerdown',function(e){e.preventDefault();c.setPointerCapture(e.pointerId);P.draw=true;var p=pt(e);x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(p[0]+.1,p[1]+.1);x.stroke();P.ink=true;var h=document.getElementById('hint'+id);if(h)h.hidden=true;});
  c.addEventListener('pointermove',function(e){if(!P.draw)return;e.preventDefault();var p=pt(e);x.lineTo(p[0],p[1]);x.stroke();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){c.addEventListener(t,function(){P.draw=false;});});}
function png(id){var c=pads[id].c,s=Math.min(1,600/c.width),o=document.createElement('canvas');o.width=Math.round(c.width*s);o.height=Math.round(c.height*s);var x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/png');}

function render(keep){var y=window.scrollY,keepIn={};
  ['s_name','s_ini','s_pin','f_tech','f_br','f_start','f_sup','rm_pin'].forEach(function(k){var e=document.getElementById(k);if(e)keepIn[k]=e.value;});
  var sigs={};['T','S'].forEach(function(k){if(pads[k]&&pads[k].ink&&document.getElementById('pad'+k))sigs[k]=pads[k].c.toDataURL();});
  app.innerHTML=S.view?hireView():homeView();
  Object.keys(keepIn).forEach(function(k){var e=document.getElementById(k);if(e&&keepIn[k])e.value=keepIn[k];});
  var fs=document.getElementById('f_start');if(fs&&!fs.value)fs.value=today();
  pads={};['T','S'].forEach(function(k){setupPad(k);if(sigs[k]&&pads[k]){var im=new Image();im.onload=function(){var P=pads[k];P.x.drawImage(im,0,0,P.c.getBoundingClientRect().width,P.c.getBoundingClientRect().height);P.ink=true;var h=document.getElementById('hint'+k);if(h)h.hidden=true;};im.src=sigs[k];}});
  if(keep===true)window.scrollTo(0,y);}
function loadPol(){var h=hire();if(!h)return;api('policySigned',[h.tech]).then(function(l){var m={};l.forEach(function(x){if(!m[x.policy]||x.when>m[x.policy])m[x.policy]=x.when;});S.pol={};Object.keys(m).forEach(function(k){S.pol[k]=new Date(m[k]).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'});});render(true);}).catch(function(){});}
function load(keep){S.loading=true;return api('obList',[]).then(function(d){S.data=d;S.loading=false;S.err='';render(keep);loadPol();}).catch(function(e){S.loading=false;S.err=String(e.message||e);render(keep);});}
function route(){var m=/^#h([\w-]+)$/.exec(location.hash);S.view=m?m[1]:'';S.signErr='';S.rm=false;S.rmErr='';S.pol={};pads={};render();window.scrollTo(0,0);if(S.data)loadPol();}

app.addEventListener('change',function(e){var t=e.target;
  if(t.id==='me'){S.me=t.value.replace(/\s+/g,' ').trim();ls('ob.me',S.me||null);return;}
  if(!t.dataset.k)return;var h=hire();if(!h)return;var k=t.dataset.k,on=t.checked,old=h.checks[k];
  if(on)h.checks[k]={by:S.me,at:today()};else delete h.checks[k];render(true);
  api('obCheck',[h.id,k,on,S.me]).then(function(c){h.checks=c;render(true);}).catch(function(x){if(old)h.checks[k]=old;else delete h.checks[k];render(true);alert('Not saved: '+(x.message||x));});});
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var a=t.dataset.a;
  if(a==='reload')load();
  if(a==='rm'){S.rm=true;S.rmErr='';render(true);var ip=document.getElementById('rm_pin');if(ip)ip.focus();}
  if(a==='rmcancel'){S.rm=false;S.rmErr='';render(true);}
  if(a==='rmgo'){var hr=hire(),rp=(document.getElementById('rm_pin').value||'').trim();if(!rp){S.rmErr='Enter the management PIN.';return render(true);}
    if(!confirm('Remove the onboarding checklist for '+hr.tech+'? This cannot be undone from the app.'))return;
    S.rmBusy=true;S.rmErr='';render(true);
    api('obRemove',[hr.id,rp]).then(function(){S.rmBusy=false;S.rm=false;S.data.hires=S.data.hires.filter(function(x){return x.id!==hr.id;});location.hash='';load();})
      .catch(function(x){S.rmBusy=false;S.rmErr=String(x.message||x);render(true);var ip=document.getElementById('rm_pin');if(ip)ip.value=rp;});}
  if(a==='showdone'){S.showDone=true;render(true);}
  if(a==='clear'){var P=pads[t.dataset.p];if(P){P.x.clearRect(0,0,P.c.width,P.c.height);P.ink=false;var hh=document.getElementById('hint'+t.dataset.p);if(hh)hh.hidden=false;}}
  if(a==='start'){var v=function(id){return (document.getElementById(id).value||'').replace(/\s+/g,' ').trim();};
    var p={tech:v('f_tech'),branch:v('f_br'),start:v('f_start'),supervisor:v('f_sup')};
    if(p.tech.split(' ').length<2){S.formErr="Enter the tech's first and last name.";return render(true);}
    if(!p.branch){S.formErr='Pick a branch.';return render(true);}
    S.formErr='';t.disabled=true;t.textContent='Starting…';
    api('obStart',[p]).then(function(id){return load().then(function(){location.hash='#h'+id;});}).catch(function(x){S.formErr=String(x.message||x);render(true);});}
  if(a==='sign'){var h=hire(),nm=(document.getElementById('s_name').value||'').replace(/\s+/g,' ').trim(),ini=(document.getElementById('s_ini').value||'').trim(),pin=(document.getElementById('s_pin').value||'').trim();
    S.signErr='';
    if(nm.split(' ').length<2)S.signErr="Enter the supervisor's first and last name.";
    else if(ini.length<2)S.signErr="Enter the supervisor's initials.";
    else if(!pads.T||!pads.T.ink)S.signErr='The tech needs to sign in the box.';
    else if(!pads.S||!pads.S.ink)S.signErr='The supervisor needs to sign in the box.';
    else if(!pin)S.signErr='Enter the management PIN.';
    if(S.signErr){render(true);return;}
    S.busy=true;render(true);
    api('obSign',[{id:h.id,supervisor:nm,initials:ini,pin:pin,techSig:png('T'),supSig:png('S')}]).then(function(r){S.busy=false;return load();}).then(function(){window.scrollTo(0,0);})
      .catch(function(x){S.busy=false;S.signErr=String(x.message||x);render(true);});}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.data&&!S.busy)load(true);});
window.addEventListener('hashchange',route);
route();load();
})();
</script>
</body>
</html>
