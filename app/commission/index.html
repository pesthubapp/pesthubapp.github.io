  var h='<h2>'+esc(d.name)+'</h2><div class="owed"><span class="k">Commission owed this pay period</span><span class="v">'+money(t.periodComm)+'</span><span class="s">on '+money(t.periodSales)+' in sales</span></div>'+
   '<div class="stats"><div class="stat"><span class="k">Sales this year</span><span class="v">'+money(t.ytdSales)+'</span></div><div class="stat"><span class="k">Commission this year</span><span class="v">'+money(t.ytdComm)+'</span></div></div>'+
   (S.note?'<p class="ok">'+esc(S.note)+'</p>':'')+(S.adding?vAdd():'<button class="btn add" data-a="add">+ Add a sale</button>')+'<section class="card"><h2>This pay period</h2>'+(d.current.length?d.current.map(function(r){return sale(r,r.cur,'');}).join(''):'<p class="muted">No sales yet this pay period.</p>')+'</section>';
  if(d.past.length) h+='<details class="card"><summary><h2>Earlier sales ('+d.past.length+')</h2></summary>'+d.past.map(function(r){return sale(r,r.paid,'');}).join('')+'</details>';
  h+='<div class="foot"><span>Live from the '+esc(d.name)+' commission tracker sheet.</span><span><button class="link" data-a="chpw">Change password</button> · <button class="link" data-a="lock">Lock</button></span></div>';
  return h;}
function render(){var h=head();
  if(S.view==='pick') h+=vPick(); else if(S.view==='pw') h+=vPw(); else if(S.view==='set') h+=vSet(!person().hasPw); else if(S.view==='chpw') h+=vSet(false); else h+=vData();
  app.innerHTML=h; var f=app.querySelector('input'); if(f&&!(S.view==='data'&&!S.adding)) f.focus();}
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.who){S.who=t.dataset.who;S.err='';var p=person();var saved=sg('comm.'+S.who);if(saved){S.pw=saved;open();return;}S.view=p.hasPw?'pw':'set';render();return;}
  if(t.dataset.a==='back'){S.err='';S.view=S.data&&S.view==='chpw'?'data':'pick';if(S.view==='pick'){S.data=null;}render();}
  if(t.dataset.a==='lock'){ss('comm.'+S.who,null);S.data=null;S.pw='';S.adding=false;S.note='';S.view='pick';render();}
  if(t.dataset.a==='chpw'){S.err='';S.note='';S.adding=false;S.view='chpw';render();}
  if(t.dataset.a==='add'){S.err='';S.note='';S.adding=true;render();}
  if(t.dataset.a==='cancel'){S.err='';S.adding=false;render();}});
app.addEventListener('input',function(e){if(e.target.id!=='s_amt')return;var n=Number(String(e.target.value).replace(/[$,\s]/g,''));var p=document.getElementById('s_prev');if(p)p.textContent='Commission: '+(n>0?'$'+(Math.round(n*rate()*100)/100).toLocaleString():'—')+' ('+Math.round(rate()*100)+'%)';});
app.addEventListener('submit',function(e){e.preventDefault();var f=e.target;
  if(f.dataset.f==='open'){S.pw=(document.getElementById('pw').value||'');if(S.pw)open();return;}
  if(f.dataset.f==='sale'){var g=function(i){return (document.getElementById(i).value||'').trim();};var sale={cust:g('s_cust'),svc:g('s_svc'),amount:g('s_amt'),date:g('s_date')};
    var n=Number(sale.amount.replace(/[$,\s]/g,''));if(!sale.cust){S.err='Enter the customer name.';}else if(!sale.svc){S.err='Enter the service.';}else if(!(n>0)){S.err='Enter the sale amount.';}else S.err='';
    if(S.err){var keep=sale;render();['s_cust','s_svc','s_amt','s_date'].forEach(function(i,k){document.getElementById(i).value=[keep.cust,keep.svc,keep.amount,keep.date][k];});return;}
    S.busy=true;render();['s_cust','s_svc','s_amt','s_date'].forEach(function(i,k){document.getElementById(i).value=[sale.cust,sale.svc,sale.amount,sale.date][k];});
    api('commAddSale',[S.who,S.pw,sale]).then(function(d){S.data=d;S.busy=false;S.adding=false;S.note='Added '+sale.cust+' · $'+n.toLocaleString()+' to the sheet.';render();})
     .catch(function(x){S.busy=false;S.err=String(x.message||x);render();['s_cust','s_svc','s_amt','s_date'].forEach(function(i,k){document.getElementById(i).value=[sale.cust,sale.svc,sale.amount,sale.date][k];});});return;}
  var n1=document.getElementById('n1').value,n2=document.getElementById('n2').value,old=document.getElementById('old');
  if(n1.length<4){S.err='Use at least 4 characters.';render();return;} if(n1!==n2){S.err='The two passwords don\'t match.';render();return;}
  S.busy=true;S.err='';render();
  api('commSetPw',[S.who,n1,old?old.value:'']).then(function(){S.busy=false;(S.list||[]).forEach(function(p){if(p.key===S.who)p.hasPw=true;});S.pw=n1;open();})
   .catch(function(x){S.busy=false;S.err=String(x.message||x);render();});});
render(); loadList();
})();
</script>
</body>
</html>
