  var p1=D.filter(function(d){return d.part==='part1';}),ref=D.map(function(d,i){return [d,i];}).filter(function(x){return x[0].part!=='part1';});
  p1.forEach(function(d){var i=D.indexOf(d),ss=sections(d);
    h+='<section class="card start"><span class="eyebrow">Start here</span><h2><a href="#d'+i+'">'+esc(short(d.title))+'</a></h2><p class="muted">Read this first. It covers both CSR roles.</p><ol class="chap">'+ss.map(function(s,k){return s.h?'<li><a href="#d'+i+'-s'+k+'">'+esc(s.h.replace(/^Chapter \d+:\s*/,''))+'</a></li>':'';}).join('')+'</ol></section>';});
  h+='<h2 class="lib">Reference library</h2><div class="docs">'+ref.map(function(x){var d=x[0],n=sections(d).filter(function(s){return s.h;}).length;
    return '<a class="doc" href="#d'+x[1]+'"><b>'+esc(short(d.title))+'</b><span>'+(d.sub?esc(d.sub):(n?n+' sections':'Quick sheet'))+'</span></a>';}).join('')+'</div>';
  return h+foot();}
function foot(){return '<div class="foot"><span>'+(S.updated?'Loaded '+new Date(S.updated).toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}):'')+'</span><span>'+(S.canEdit?'<button class="link" data-a="imp">Update manual</button> · ':'')+'<button class="link" data-a="lock">Lock</button></span></div>'+(S.imp&&S.canEdit?importView(false):'');}
function results(){var q=S.q.trim().toLowerCase(),words=q.split(/\s+/),out=[];
  docs().forEach(function(d,di){var sec=null,sk=-1;d.blocks.forEach(function(b,bi){if(b.t==='h2'){sec=b.x;sk++;}var t=blockText(b),tl=t.toLowerCase();
    if(words.every(function(w){return tl.indexOf(w)>=0;})&&out.length<80){var at=tl.indexOf(words[0]),st=Math.max(0,at-60),snip=(st?'…':'')+t.slice(st,st+180)+(t.length>st+180?'…':'');
      out.push('<a class="hit" href="#d'+di+'-b'+bi+'"><span class="where">'+esc(short(d.title))+(sec&&b.t!=='h2'?' · '+esc(sec):'')+'</span><span class="snip">'+mark(snip,words)+'</span></a>');}});});
  return '<p class="muted">'+(out.length?out.length+(out.length>=80?'+':'')+' matches':'No matches. Try fewer or different words.')+'</p><div class="hits">'+out.join('')+'</div>';}
function mark(s,words){var h=esc(s);words.forEach(function(w){if(!w)return;var e=esc(w).replace(/[.*+?^()|[\]\\{}$]/g,'\\$&');h=h.replace(new RegExp('('+e+')','ig'),'<mark>$1</mark>');});return h;}
function docView(){var di=S.doc,d=docs()[di];if(!d){S.doc=-1;return homeView();}
  var ss=sections(d),many=ss.filter(function(s){return s.h;}).length>2&&!/Quick Reference Card/.test(d.title),h=head(d.part==='part1'?'Quick-Start Guide':'Reference library');
  h+='<h1>'+esc(short(d.title))+'</h1>';
  if(many) h+='<div class="tools"><select id="jump" aria-label="Jump to section"><option value="">Jump to a section…</option>'+ss.map(function(s,k){return s.h?'<option value="'+k+'">'+esc(s.h)+'</option>':'';}).join('')+'</select><button class="link" data-a="all">'+(S.allOpen?'Collapse all':'Expand all')+'</button></div>';
  ss.forEach(function(s,k){var body=s.b.map(function(x){return block(x[0],di,x[1]);}).join('');
    if(!s.h){h+='<div class="intro">'+body+'</div>';return;}
    var op=!many||S.allOpen||S.open[di+'-'+k];
    h+='<details class="sec" id="s'+di+'-'+k+'" data-k="'+di+'-'+k+'"'+(op?' open':'')+'><summary id="b'+di+'-'+s.i0+'">'+esc(s.h)+'</summary><div class="body">'+body+'</div></details>';});
  var prev=di>0?'<a href="#d'+(di-1)+'">‹ '+esc(short(docs()[di-1].title))+'</a>':'<span></span>',next=di<docs().length-1?'<a href="#d'+(di+1)+'">'+esc(short(docs()[di+1].title))+' ›</a>':'<span></span>';
  return h+'<nav class="pn">'+prev+next+'</nav>';}
function render(){var h;if(!S.data)h=lockView();else if(S.doc>=0)h=docView();else h=homeView();app.innerHTML=h;
  var p=document.getElementById('pin');if(p)p.focus();}
function route(){var m=/^#d(\d+)(?:-(s|b)(\d+))?$/.exec(location.hash);S.doc=m?+m[1]:-1;var target=null;
  if(m&&m[2]==='s'){S.open[m[1]+'-'+m[3]]=1;target='s'+m[1]+'-'+m[3];}
  if(m&&m[2]==='b'){var d=docs()[S.doc];if(d){var ss=sections(d);ss.forEach(function(s,k){if(s.i0==+m[3]||s.b.some(function(x){return x[1]==+m[3];}))S.open[m[1]+'-'+k]=1;});}target='b'+m[1]+'-'+m[3];}
  render();
  if(target){var el=document.getElementById(target);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1800);}}
  else window.scrollTo(0,0);}
app.addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('pin');S.pin=(p&&p.value||'').trim();if(S.pin)load();});
app.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(x){}}});
app.addEventListener('change',function(e){var t=e.target;
  if(t.id==='jump'&&t.value!==''){location.hash='#d'+S.doc+'-s'+t.value;}
  if(t.dataset&&t.dataset.k&&t.type==='checkbox')ls(t.dataset.k,t.checked?'1':null);
  if(t.id==='file'&&t.files&&t.files[0]){S.err='';S.msg='Uploading…';render();t.files[0].text().then(function(txt){var d=JSON.parse(txt);if(!d||!d.docs)throw new Error('That is not a CSR manual file.');
    return api('manualSave',[S.pin,txt]).then(function(r){S.data=d;S.updated=r.updated;S.msg='Loaded '+r.docs+' documents.';S.imp=false;save();render();});})
    .catch(function(x){S.msg='';S.err=String(x.message||x);render();});}});
app.addEventListener('toggle',function(e){var t=e.target;if(t.classList&&t.classList.contains('sec'))S.open[t.dataset.k]=t.open?1:0;},true);
app.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
  if(t.dataset.copy){var p=t.dataset.copy.split('-'),b=docs()[+p[0]].blocks[+p[1]],txt=String(b.x).replace(/^["“]|["”]$/g,'');
    var done=function(){t.textContent='Copied';setTimeout(function(){t.textContent='Copy';},1500);};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,function(){});else done();}
  if(t.dataset.a==='all'){S.allOpen=!S.allOpen;if(!S.allOpen)S.open={};render();}
  if(t.dataset.a==='imp'){S.imp=!S.imp;S.msg='';S.err='';render();}
  if(t.dataset.a==='lock'){S.data=null;S.pin='';ls('man.pin',null);ls('man.data',null);location.hash='';render();}});
window.addEventListener('hashchange',route);
route(); if(S.pin&&S.data) load();
})();
</script>
