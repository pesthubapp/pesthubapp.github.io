<style>
:root{--bg:#f3f6f4;--surface:#fff;--sunk:#e6ecE8;--ink:#1f2324;--muted:#55635a;--line:#d5dfd8;--accent:#046725;--accent-ink:#ffffff;--accent-soft:#e4f1e8;--accent-deep:#034d1c;--ok:#067a2e;

--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0e100c;--surface:#181b15;--sunk:#0a0b08;--ink:#eef2ea;--muted:#9ba393;--line:#2a2f25;--accent:#8cc63f;--accent-soft:#25331a;--accent-deep:#4f7420;--ok:#9fd65a;
--warn:#e3a94c;--warn-soft:#3a2d15;--crit:#ef7d72;--crit-soft:#3d1c19;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
[hidden]{display:none!important}
#app{max-width:1000px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:var(--ok)}
.back{align-self:flex-start;font-weight:600;font-size:.95rem;text-decoration:none;padding:4px 0;margin-bottom:-8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;flex:none}.brand .txt{display:grid;line-height:1.1}
.brand b{font-family:var(--display);font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
h2{font:700 1.9rem/1.05 var(--display);margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea{width:100%;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar input{flex:1 1 200px;width:auto}

.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px}
.eq{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}

.note{padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:.95rem}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tech{min-height:84px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font:600 1.5rem var(--display);padding:10px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.box p{margin:0;color:var(--muted)}
.pin{flex:1;display:grid;place-items:center}

.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:20;font-weight:600;max-width:calc(100% - 32px)}
.sticky{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.qty{font:700 1.5rem var(--display);white-space:nowrap;text-align:right}
.qty small{display:block;font:600 .78rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.holders{grid-column:1/-1;display:grid;gap:6px;margin-top:4px}
.holder{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--sunk);flex-wrap:wrap}
.holder.late{background:var(--crit-soft)}
.holder span{font-size:.95rem;overflow-wrap:anywhere}
.acts{grid-column:1/-1;display:flex;justify-content:flex-end}
.step{display:flex;align-items:center;gap:12px}
.step button{width:56px;height:56px;border-radius:14px;font:700 1.8rem var(--display);background:var(--sunk);border:1px solid var(--line)}
.step output{font:700 2.4rem var(--mono);min-width:64px;text-align:center}
.arow{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
@media (max-width:480px){.arow{grid-template-columns:1fr 76px}.arow .bar{grid-column:1/-1;justify-content:flex-end}}
</style>
</head>

  return items; }
var flushing=false;
function retryable(m){ return /connection|server error|timeout|lock|too many|try again|unavailable|internal/i.test(m); }
function flush(){ if(flushing) return; var q=getQ(); if(!q.length) return; flushing=true; var op=q[0];
  var call=op.fn==='eqOut'?api('eqOut',op.tech,op.item,op.qty,op.note,op.when,op.key):api('eqIn',op.hold,op.qty,op.note,op.when,op.key);
  call.then(function(){ setQ(getQ().filter(function(x){return x.key!==op.key;})); flushing=false; if(!getQ().length) load(); else if(S.view==='home') render(); flush(); })
    .catch(function(e){ flushing=false; var m=msg(e); if(!retryable(m)){ setQ(getQ().filter(function(x){return x.key!==op.key;})); toast('Not saved: '+m); load(); flush(); } }); }
setInterval(flush,20000); window.addEventListener('online',flush);
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ flush(); if(S.view==='home') load(); } });
function queue(op){ op.key=Date.now().toString(36)+Math.random().toString(36).slice(2,8); op.when=Date.now();
  var q=getQ(); q.push(op); setQ(q); S.items=overlay(S.items); flush(); }

/* ---------- data ---------- */
function fromCache(){ try{ var c=JSON.parse(store('eqCo')||'null'); if(c&&c.items){ S.items=overlay(c.items); S.techs=c.techs; S.loaded=true; } }catch(_){} }
function load(){
  return api('eqList').then(function(d){ store('eqCo',JSON.stringify(d)); S.items=overlay(d.items); S.techs=d.techs; S.loaded=true; S.err=''; if(S.view==='home') render(); })
    .catch(function(e){ if(!S.loaded){ S.err='Can\'t reach the equipment list: '+msg(e); } if(S.view==='home') render(); }); }

/* ---------- views ---------- */
function vHome(){
  var q=S.q.toLowerCase(), totalOut=S.items.filter(function(e){return outN(e)>0;}).length;
  var list=S.items.filter(function(e){ return (S.filter==='all'||outN(e)>0) && (!q||(e.name+' '+e.out.map(function(o){return o.tech+' '+o.note;}).join(' ')).toLowerCase().indexOf(q)>=0); });
  var n=getQ().length;
  var body=!S.loaded&&!S.err?'<div class="empty">Loading equipment…</div>':
    !S.items.length?'<div class="empty"><b>No equipment yet</b>A manager can add items under Manager.</div>':
    !list.length?'<div class="empty">Nothing matches.</div>':
    '<div class="list">'+list.map(function(e){
      var a=avail(e), o=outN(e), late=e.out.some(function(h){ return h.since&&(Date.now()-h.since)/86400000>=LATE_DAYS; });
      return '<div class="eq'+(o?(late?' late':' out'):'')+'"><div><b>'+esc(e.name)+'</b><div class="st">'+
        (o?'<span class="pill '+(late?'crit':'warn')+'">'+o+' out</span>':'')+'<span class="pill '+(a?'ok':'crit')+'">'+a+' available</span></div></div>'+
        '<div class="qty">'+a+' / '+e.total+'<small>in shop</small></div>'+
        (e.out.length?'<div class="holders">'+e.out.map(function(h){ var lt=h.since&&(Date.now()-h.since)/86400000>=LATE_DAYS;
          return '<div class="holder'+(lt?' late':'')+'"><span><b>'+esc(h.tech)+'</b> has '+h.qty+' · '+ago(h.since)+(h.note?' · '+esc(h.note):'')+'</span><button class="btn sm" data-a="ret" data-id="'+h.id+'">Return</button></div>'; }).join('')+'</div>':'')+
        '<div class="acts"><button class="btn primary" data-a="take" data-id="'+e.id+'"'+(a?'':' disabled')+'>'+(a?'Check out':'None available')+'</button></div></div>';
    }).join('')+'</div>';
  return header('<button class="btn ghost sm" data-a="toPin">Manager</button>')+
    (S.err?'<div class="note err">'+esc(S.err)+'</div>':'')+
    (n?'<div class="note">⟳ '+n+' change'+(n===1?'':'s')+' waiting to sync — it\'ll send automatically when the connection is back.</div>':'')+
    '<div class="bar"><input type="search" id="q" placeholder="Search equipment, tech or job" value="'+esc(S.q)+'">'+
    [['all','All'],['out','Checked out ('+totalOut+')']].map(function(f){ return '<button class="chip" data-a="filter" data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'; }).join('')+'</div>'+body;
}
function stepper(max){ return '<div class="step"><button data-a="minus" aria-label="Fewer">−</button><output>'+S.n+'</output><button data-a="plus" aria-label="More">+</button><span class="eyebrow">of '+max+'</span></div>'; }
function vTake(){
  var e=byId(S.sel)||{name:'',total:0,out:[]}, a=avail(e);
  return header('<button class="btn sm" data-a="home">Cancel</button>')+
    '<div><span class="eyebrow">Check out</span><h2>'+esc(e.name)+'</h2></div>'+
    '<span class="eyebrow">Who\'s taking it?</span>'+
    (S.techs.length?'<div class="grid">'+S.techs.map(function(t,i){ return '<button class="tech" data-a="pickTech" data-i="'+i+'" aria-pressed="'+(S.tech===t)+'">'+esc(t)+'</button>'; }).join('')+'</div>':
      '<div class="box empty"><b>No techs yet</b>Techs are managed in Inventory → Manager → Techs.</div>')+
    '<span class="eyebrow">How many?</span>'+stepper(a)+
    '<label class="eyebrow" for="note">Job or address (optional)</label><input id="note" placeholder="e.g. 123 Main St, skunk under deck" value="'+esc(S.note||'')+'">'+
    '<div class="sticky"><button class="btn primary" data-a="confirmTake"'+(S.tech&&a?'':' disabled')+'>Check out '+S.n+' to '+(S.tech?esc(S.tech):'…')+'</button></div>';
}
function vRet(){
  var f=findHold(S.hold); if(!f) return header('')+'<div class="empty">Already returned.</div>';
  return header('<button class="btn sm" data-a="home">Cancel</button>')+
    '<div><span class="eyebrow">Return</span><h2>'+esc(f.it.name)+'</h2></div>'+
    '<div class="box"><p><b style="color:var(--ink)">'+esc(f.o.tech)+'</b> has '+f.o.qty+' · out '+ago(f.o.since)+(f.o.note?' · '+esc(f.o.note):'')+'</p>'+
    (f.o.qty>1?'<span class="eyebrow">How many coming back?</span>'+stepper(f.o.qty):'')+
    '<label class="eyebrow" for="note">Note (optional)</label><input id="note" placeholder="e.g. needs new bait tray" value="'+esc(S.note||'')+'"></div>'+
    '<div class="sticky"><button class="btn primary" data-a="confirmRet">Return '+S.n+'</button></div>';
}
function vPin(){
  return header('<button class="btn sm" data-a="home">Back</button>')+
    '<div class="pin"><form id="pinForm"><span class="eyebrow">Manager PIN</span><input id="pinIn" placeholder="Demo PIN: 1234" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">'+
    '<button class="btn primary" type="submit"'+(S.busy?' disabled':'')+'>'+(S.busy?'Checking…':'Unlock')+'</button><p class="eyebrow" style="text-transform:none;letter-spacing:0">Same PIN as the Pricing page.</p></form></div>';
}
function vAdmin(){
  return header('<button class="btn sm" data-a="lock">Done</button>')+
    '<form class="box" id="addForm"><b>Add equipment</b><div class="arow" style="border:0;padding:0"><input id="newName" placeholder="e.g. Raccoon trap"><input id="newQty" type="number" min="0" inputmode="numeric" placeholder="Qty" aria-label="Quantity"><button class="btn primary" type="submit">Add</button></div></form>'+
    '<div class="box"><b>Equipment ('+S.items.length+')</b><p>Change a name or quantity and tap outside the box to save.</p><div>'+(S.items.map(function(e){
      return '<div class="arow"><input data-ed="name" data-id="'+e.id+'" value="'+esc(e.name)+'" aria-label="Name"><input data-ed="total" data-id="'+e.id+'" type="number" min="0" inputmode="numeric" value="'+e.total+'" aria-label="Quantity"><span class="bar">'+
        (S.confirm===e.id?'<button class="btn danger sm" data-a="del" data-id="'+e.id+'">Delete</button><button class="btn sm" data-a="noconf">Keep</button>':'<button class="btn ghost sm" data-a="conf" data-id="'+e.id+'">Remove</button>')+'</span></div>'; }).join('')||'<p>No equipment yet.</p>')+'</div></div>'+
    '<div class="box"><b>History</b><div>'+(S.log.length?S.log.map(function(l){ return '<div class="log"><span class="w">'+fmt(l.when)+'</span><span><b>'+esc(l.who)+'</b> · '+esc(l.action)+' '+(l.qty||'')+' · '+esc(l.item)+(l.note?' <span style="color:var(--muted)">— '+esc(l.note)+'</span>':'')+'</span></div>'; }).join(''):'<p>No activity yet.</p>')+'</div></div>';
}
function render(){ app.innerHTML=({home:vHome,take:vTake,ret:vRet,pin:vPin,admin:vAdmin})[S.view](); if(S.view==='pin'){ var p=document.getElementById('pinIn'); if(p) p.focus(); } }
function go(v){ S.view=v; S.confirm=null; render(); window.scrollTo(0,0); }
function keepNote(){ var n=document.getElementById('note'); if(n) S.note=n.value; }
function admin(action,payload,ok){ S.busy=true; return api('eqAdmin',S.pin,action,payload||{}).then(function(d){ S.busy=false; S.items=overlay(d.items); S.techs=d.techs; S.log=d.log; store('eqCo',JSON.stringify({items:d.items,techs:d.techs})); if(ok) toast(ok); return true; })
  .catch(function(e){ S.busy=false; toast(msg(e)); return false; }); }

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b||b.disabled) return; var a=b.getAttribute('data-a'), id=b.getAttribute('data-id');
  if(a==='filter'){ S.filter=b.getAttribute('data-f'); render(); }
  else if(a==='take'){ S.sel=id; S.tech=null; S.note=''; S.n=1; go('take'); }
  else if(a==='ret'){ var f=findHold(id); S.hold=id; S.note=''; S.n=f?f.o.qty:1; go('ret'); }
  else if(a==='pickTech'){ keepNote(); S.tech=S.techs[+b.getAttribute('data-i')]; render(); }
  else if(a==='minus'||a==='plus'){ keepNote(); var max=S.view==='take'?avail(byId(S.sel)||{total:0,out:[]}):((findHold(S.hold)||{o:{qty:1}}).o.qty);
    S.n=Math.max(1,Math.min(max,S.n+(a==='plus'?1:-1))); render(); }
  else if(a==='confirmTake'){ keepNote(); var it=byId(S.sel); queue({fn:'eqOut',item:S.sel,tech:S.tech,qty:S.n,note:S.note||''}); toast(S.n+' '+(it?it.name:'item')+' checked out to '+S.tech); go('home'); }
  else if(a==='confirmRet'){ keepNote(); var h=findHold(S.hold); queue({fn:'eqIn',hold:S.hold,qty:S.n,note:S.note||''}); toast(S.n+' '+(h?h.it.name:'item')+' returned'); go('home'); }
  else if(a==='home'){ go('home'); load(); }
  else if(a==='toPin'){ go('pin'); }
  else if(a==='lock'){ S.pin=null; go('home'); load(); }
  else if(a==='conf'){ S.confirm=id; render(); }
  else if(a==='noconf'){ S.confirm=null; render(); }
  else if(a==='del'){ admin('delete',{id:id},'Removed').then(function(){ S.confirm=null; render(); }); }
});
app.addEventListener('input',function(e){ if(e.target.id==='q'){ S.q=e.target.value; var pos=e.target.selectionStart; render(); var n=document.getElementById('q'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} } });
app.addEventListener('change',function(e){ var k=e.target.getAttribute('data-ed'), id=e.target.getAttribute('data-id'); if(!k) return; var it=byId(id); if(!it) return;
  var v=e.target.value.trim(), p={id:id};
  if(k==='name'){ if(!v||v===it.name) return; p.name=v; } else { var q=Math.max(0,Math.floor(Number(v)||0)); if(q===it.total) return; p.total=q; }
  admin('update',p,'Saved').then(function(){ render(); }); });
app.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='pinForm'){ var p=document.getElementById('pinIn').value; if(!p) return; S.busy=true; render();
    api('eqAdmin',p,'list',{}).then(function(d){ S.busy=false; S.pin=p; S.items=overlay(d.items); S.techs=d.techs; S.log=d.log; go('admin'); })
      .catch(function(err){ S.busy=false; render(); toast(msg(err)); }); }
  else if(e.target.id==='addForm'){ var nm=document.getElementById('newName').value.trim(), q=document.getElementById('newQty').value; if(!nm) return;
    admin('add',{name:nm,total:q||1},'Added '+nm).then(function(){ render(); }); }
});
var idle; function resetIdle(){ clearTimeout(idle); idle=setTimeout(function(){ if(S.view!=='home'){ S.pin=null; go('home'); load(); } }, S.view==='admin'?300000:120000); }
['pointerdown','keydown'].forEach(function(ev){ document.addEventListener(ev,resetIdle,{passive:true}); });
setInterval(function(){ if(S.view==='home') load(); },60000);
fromCache(); render(); load(); flush();
})();
</script>
</body>
</html>
